<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <base href="%BASE_URL%" />
  <!-- Déclare que la page gère elle-même clair ET sombre → les navigateurs
       Android (Chrome « Assombrir les sites », Samsung Internet « Mode sombre »)
       ne repeignent pas l'UI de force (couleurs décalées, mode clair cassé). -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#6366f1" />

  <!-- ╔══ SEO ══╗ -->
  <title>PermiGo — le compagnon qui te prépare avant chaque heure de conduite</title>
  <meta name="description" content="PermiGo te prépare avant chaque heure de conduite et t'accompagne entre deux leçons : fiches de préparation, mini-jeux « En situation », examens blancs, suivi de progression. Mode découverte gratuit." />
  <meta name="keywords" content="permis de conduire, préparer leçon de conduite, réviser la conduite, examen blanc, app permis, centre d'examen permis, moniteur indépendant" />
  <link rel="canonical" href="https://www.permigo.fr/" />

  <!-- ╔══ Open Graph ══╗ -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PermiGo" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="PermiGo — le compagnon qui te prépare avant chaque heure de conduite" />
  <meta property="og:description" content="Prépare chaque leçon avant de monter en voiture, débriefe après, progresse entre deux. Mode découverte gratuit, Pass Permis dès 9,99 €/mois." />
  <meta property="og:url" content="https://www.permigo.fr/" />
  <meta property="og:image" content="https://www.permigo.fr/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ╔══ Twitter Card ══╗ -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PermiGo — le compagnon qui te prépare avant chaque heure de conduite" />
  <meta name="twitter:description" content="Prépare chaque leçon avant de monter en voiture, débriefe après, progresse entre deux. Mode découverte gratuit, Pass Permis dès 9,99 €/mois." />
  <meta name="twitter:image" content="https://www.permigo.fr/og-image.png" />

  <!-- ╔══ JSON-LD (entité marque + produit — base GEO/réponses IA) ══╗
       UN SEUL bloc SoftwareApplication (le doublon « Beta gratuite, price 0 »
       a été retiré : il contredisait les vrais prix du Pass) + l'entité marque. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "PermiGo",
    "url": "https://www.permigo.fr/",
    "logo": "https://www.permigo.fr/permigo-logo.png",
    "description": "PermiGo est le compagnon de l'élève conducteur : il le prépare avant chaque heure de conduite et l'accompagne entre deux leçons. Le moniteur suit la progression depuis son tableau de bord."
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "PermiGo",
    "url": "https://www.permigo.fr/",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "description": "Le compagnon qui prépare l'élève avant chaque heure de conduite : fiches de préparation de leçon, mini-jeux « En situation », examens blancs, suivi de progression. Mode découverte gratuit, puis Pass Permis.",
    "offers": [
      { "@type": "Offer", "name": "Pass mensuel", "price": "9.99", "priceCurrency": "EUR" },
      { "@type": "Offer", "name": "Pass 3 mois", "price": "24.99", "priceCurrency": "EUR" },
      { "@type": "Offer", "name": "Pass 6 mois", "price": "39.99", "priceCurrency": "EUR" }
    ]
  }
  </script>

  <!-- ╔══ Favicons ══╗ -->
  <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icon-512.png" />

  <!-- ╔══ PWA ══╗ -->
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PermiGo" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <!-- ╔══ CSP ══╗ -->
  <!-- frame-ancestors est IGNORÉ en <meta> (warning console) → fourni en
       en-tête HTTP via vercel.json, pas ici. -->
  <!-- ⚠️ C'est CETTE meta qui fait foi en prod : les blocs "/(.*)" du
       vercel.json ne sortent PAS (constaté 16/07/2026 — seuls les blocs à
       préfixe simple type /sw.js sont servis). Toute nouvelle origine
       (script, frame, connect…) doit donc être ajoutée ICI.
       accounts.google.com/gsi = bouton Google officiel (GIS) du login. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://eu.i.posthog.com https://eu-assets.i.posthog.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; manifest-src 'self'; worker-src 'self';" />

  <!-- ╔══ Preconnects critiques ══╗ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://arrfmdagdqtrtfbhxlty.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://arrfmdagdqtrtfbhxlty.supabase.co" />

  <!-- ╔══ Fonts ══╗ -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- ╔══ Écran de chargement (feu vert) — critical CSS inline ══╗
       Inliné ici (pas dans le bundle) pour s'afficher AVANT que le JS charge.
       Écran de MARQUE : toujours en vert PermiGo, indépendant de l'accent user. -->
  <style>
    #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--bg,#f4f5fb);padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);animation:spFade .3s ease;overflow:hidden}
    #splash::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 40%,rgba(88,204,2,.14),transparent 60%);pointer-events:none}
    #splash .tl-badge{width:84px;height:84px;animation:spFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 14px 26px rgba(70,163,2,.34))}
    #splash .tl-badge img{width:100%;height:100%;object-fit:contain;display:block}
    #splash .tl-housing{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:22px;background:linear-gradient(180deg,#23262b,#0d0e10);box-shadow:0 16px 34px rgba(10,12,18,.32),0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.08)}
    #splash .tl-lamp{width:36px;height:36px;border-radius:50%;background:#1b1c1e;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
    #splash .tl-lamp.r{animation:spRed 2.4s infinite}
    #splash .tl-lamp.y{animation:spAmber 2.4s infinite}
    #splash .tl-lamp.g{animation:spGreen 2.4s infinite}
    #splash .tl-go{font:800 17px/1 'Plus Jakarta Sans','Nunito',sans-serif;color:#46A302;letter-spacing:-.01em;opacity:0;animation:spGo 2.4s infinite}
    @keyframes spFade{from{opacity:0}to{opacity:1}}
    @keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes spRed{0%,26%{background:#ff4035;box-shadow:0 0 16px 3px #ff4035,inset 0 2px 5px rgba(0,0,0,.35)}32%,100%{background:#3a1413;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}}
    @keyframes spAmber{0%,28%{background:#2b2710}34%,44%{background:#ffc107;box-shadow:0 0 16px 3px #ffc107}50%,100%{background:#2b2710}}
    @keyframes spGreen{0%,50%{background:#12300f}58%,100%{background:#46e314;box-shadow:0 0 22px 6px rgba(70,227,20,.7)}}
    @keyframes spGo{0%,52%{opacity:0;transform:scale(.8)}62%,100%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){
      #splash .tl-badge{animation:none}
      #splash .tl-lamp.r,#splash .tl-lamp.y{animation:none;background:#2b2710;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
      #splash .tl-lamp.g{animation:none;background:#46e314;box-shadow:0 0 22px 6px rgba(70,227,20,.7)}
      #splash .tl-go{animation:none;opacity:1}
    }
  </style>
</head>
<body>
  <!-- A11y : skip link -->
  <a href="#app" class="skip-link">Aller au contenu principal</a>

  <!-- Container racine -->
  <div id="app" role="main" tabindex="-1">
    <div id="splash" aria-busy="true" aria-label="Chargement de PermiGo">
      <div class="tl-badge"><img src="%BASE_URL%skins/avatars/permigo-badge-icon.png" alt="PermiGo" width="84" height="84" /></div>
      <div class="tl-housing" aria-hidden="true">
        <span class="tl-lamp r"></span>
        <span class="tl-lamp y"></span>
        <span class="tl-lamp g"></span>
      </div>
      <div class="tl-go" aria-hidden="true">C'est parti</div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-root" aria-live="polite"></div>

  <!-- Modal container -->
  <div id="modal-root"></div>

  <!-- Module entry -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
