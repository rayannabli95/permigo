  <!-- ╔══ Fonts ══╗
       UNE famille de texte pour toute l'app : Archivo, celle du hero
       « Prépare ta leçon ». Axe 400→900 (un seul fichier variable) : les
       déclarations demandaient jusqu'à 900 alors que seul 500→800 était
       chargé, le navigateur fabriquait un faux gras.
       La mono reste pour les CHIFFRES (compteurs, dates, scores) :
       chasse fixe = les nombres ne dansent pas quand ils changent.
       Retirées le 30/07 (plus une seule déclaration dans src/) : Plus Jakarta
       Sans, Inter, Nunito, Fredoka, Baloo 2 — et Manrope / Fredoka One, que
       des pages moniteur demandaient sans qu'elles soient chargées ici. -->
  <!-- ⚠️ Servies depuis NOTRE domaine depuis le 01/08/2026, plus depuis
       fonts.googleapis.com. Trois raisons : deux connexions vers un tiers
       avant le premier texte affiché, une feuille de style bloquante de plus
       sur la page qui reçoit la publicité, et l'adresse IP du visiteur
       envoyée à Google avant même qu'il ait répondu au bandeau de
       consentement. 96 Ko au total, mis en cache par le service worker.
       JetBrains Mono est abandonnée au passage : elle n'était nommée que
       dans la pile de repli de --fn, jamais déclarée nulle part. IBM Plex
       Mono prend sa place, c'est déjà la suivante dans la pile. -->
  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Archivo — un seul fichier variable par sous-ensemble, axe 400→900. */
    @font-face {
      font-family: 'Archivo'; font-style: normal; font-weight: 400 900;
      font-display: swap; src: url(/fonts/archivo-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Archivo'; font-style: normal; font-weight: 400 900;
      font-display: swap; src: url(/fonts/archivo-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    /* IBM Plex Mono — les CHIFFRES (compteurs, dates, scores) : chasse fixe,
       les nombres ne dansent pas quand ils changent. Latin seul : on n'écrit
       jamais de prose dans cette police. */
    @font-face {
      font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500;
      font-display: swap; src: url(/fonts/plexmono-500-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600;
      font-display: swap; src: url(/fonts/plexmono-600-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 700;
      font-display: swap; src: url(/fonts/plexmono-700-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>

  <!-- ╔══ Écran de chargement (logo animé) — critical CSS inline ══╗
       Inliné ici (pas dans le bundle) pour s'afficher AVANT que le JS charge.
       Écran de MARQUE : fond nuit + logo animé (globe → route → « P »),
       identique quel que soit l'accent choisi par l'utilisateur.
       Le fond #010208 est la couleur EXACTE du fond de la vidéo → raccord
       invisible, aucune bordure visible autour du carré vidéo. -->
  <style>
    /* z-index au niveau --z-splash : le splash est un FRÈRE de #app (et non un
       enfant), sinon le premier `app.innerHTML = …` d'une page l'efface avant
       que la vidéo ait eu le temps de jouer. */
    /* La sortie n'est pas un simple fondu : le logo grandit un peu pendant qu'il
       s'efface, comme un objectif qui s'ouvre sur la page. Un fondu plat donnait
       une coupure sèche entre le noir et l'app. */
    #splash{position:fixed;inset:0;z-index:10100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#010208;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);animation:spFade .25s ease;overflow:hidden;transition:opacity .4s ease,transform .4s cubic-bezier(.32,0,.24,1);will-change:opacity,transform}
    #splash.is-out{opacity:0;transform:scale(1.09);pointer-events:none}
    /* La halo remplit le vide autour du logo. À .16 sur 62 % il ne se voyait
       pas : l'écran était un rectangle noir mort avec une bille au milieu. */
    #splash::before{content:"";position:absolute;inset:0;background:radial-gradient(88% 52% at 50% 43%,rgba(124,110,255,.30),rgba(70,52,160,.13) 46%,transparent 72%);pointer-events:none}
    /* `screen` rend le noir de la vidéo transparent : plus aucun carré visible
       autour du logo, même si l'encodage n'a pas un noir parfait. */
    /* 58vw laissait 290 px de noir vide au-dessus ET en dessous sur un iPhone :
       une bille perdue au centre. Le logo occupe maintenant l'écran. */
    #splash .sp-logo{position:relative;width:min(78vw,320px);aspect-ratio:1;display:block;mix-blend-mode:screen}
    #splash .sp-logo video,#splash .sp-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
    /* Avant que la 1re frame soit décodée, certains navigateurs (iOS Safari,
       quelques WebView Android) peignent la vidéo en BLANC par défaut au lieu
       de transparent. Le parent est en mix-blend-mode:screen : screen(blanc,x)
       = blanc plein écran → c'est la zone blanche qui apparaît au lancement,
       le temps que la vidéo ait une image à montrer. On force son fond à la
       couleur du splash pour neutraliser ce blanc. */
    #splash .sp-logo video{z-index:1;background:#010208}
    /* Le poster est la dernière image (logo COMPLET) : l'afficher d'entrée
       spoilerait l'animation. Il ne sert donc que de repli — vidéo en erreur,
       autoplay refusé ou mouvement réduit. */
    #splash .sp-logo img{opacity:0}
    #splash.is-fallback .sp-logo img{opacity:1}
    #splash.is-fallback .sp-logo video{display:none}
    /* Le « bonjour » défile dans toutes les langues : hauteur figée (les
       glyphes arabes, tamouls ou CJK sont plus hauts que le latin, sinon le
       logo sautille) et repli system-ui pour les écritures que les polices
       de marque ne couvrent pas. Le fondu était sur 1,6 s démarré à 0,5 s —
       le texte n'atteignait sa pleine opacité qu'une fois le splash parti :
       ramené à 0,3 s démarré à 0,15 s, pour que les mots soient LISIBLES. */
    #splash .sp-go{font:800 19px/1.35 'Archivo',system-ui,sans-serif;color:#b7abff;letter-spacing:.01em;text-align:center;min-height:1.35em;opacity:0;animation:spGo .3s ease .15s forwards}
    @keyframes spFade{from{opacity:0}to{opacity:1}}
    @keyframes spGo{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    /* Mouvement réduit : pas de vidéo, le logo fixe suffit. */
    @media (prefers-reduced-motion:reduce){
      #splash{animation:none}
      #splash .sp-logo video{display:none}
      #splash .sp-logo img{opacity:1}
      #splash .sp-go{animation:none;opacity:1}
    }
  </style>
</head>
<body>
  <!-- A11y : skip link -->
  <a href="#app" class="skip-link">Aller au contenu principal</a>

  <!-- Écran de chargement. FRÈRE de #app (voir le CSS plus haut) -->
  <!-- role="status" : un div nu n'a pas le droit de porter aria-label (axe le
       refuse, RGAA 7.1.1). C'est aussi le bon rôle pour un écran d'attente. -->
  <div id="splash" role="status" aria-busy="true" aria-label="Chargement de PermiGo">
    <div class="sp-logo" aria-hidden="true">
      <img src="%BASE_URL%splash-permigo-poster.jpg" alt="" width="240" height="240" />
      <video src="%BASE_URL%splash-permigo.mp4"
             autoplay muted playsinline disablepictureinpicture preload="auto"></video>
    </div>
    <div class="sp-go" dir="auto" aria-hidden="true">Bonjour</div>
  </div>
  <script>
    /* Pilotage du splash — inline pour démarrer la vidéo au plus tôt.
       Sans ça, Chrome n'enclenche l'autoplay qu'à la fin du parsing (mesuré en
       prod : prête à 350 ms, jouée à 886 ms) et la première page l'effaçait à
       967 ms — la vidéo ne restait que 80 ms à l'écran. */
    (function () {
      var sp = document.getElementById('splash');
      if (!sp) return;
      var v = sp.querySelector('video');
      /* Réglages du tempo. Le premier jet allait trop vite : on n'avait pas le
         temps de lire les bonjours. La vidéo repasse à sa vitesse naturelle et
         se joue quasi en entier. */
      var RATE = 1;       // vitesse naturelle (le logo se dessine sur 1,25 s)
      var SEEN = 2;       // on ferme après ces secondes de vidéo vues (durée : 2,07 s)
      var CAP = 3400;     // filet : le splash ne retarde jamais plus le boot
      var STEP = 210;     // un « bonjour » toutes les 210 ms
      var LAND = 0.6;     // sa langue se pose 0,6 s avant la fin
      var closed = false;

      /* ⚠️ Le moment de marque coûte 2 à 3,4 secondes alors que la page est
         prête à 800 ms en 4G (mesuré le 01/08/2026). Pour quelqu'un qui NOUS
         CONNAÎT (app installée, ou visiteur déjà venu qui a répondu aux
         cookies), c'est un plaisir. Pour un inconnu venu d'une pub, ce sont
         les 2 secondes pendant lesquelles il décide de rester ou de partir.
         Version courte pour lui : le logo se dessine quand même (vitesse 1,6)
         et les bonjours défilent plus vite, mais on rend la main sous 1 s. */
      var known = false;
      try {
        known = !!localStorage.getItem('permigo_cookie_consent') ||
                !!localStorage.getItem('permigo_lang_explicit');
      } catch (e) { /* mode privé strict */ }
      var installed = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ||
                      navigator.standalone === true;
      var QUICK = !known && !installed;
      if (QUICK) {
        RATE = 1.8; SEEN = 1.15; CAP = 900; STEP = 105; LAND = 0.45;
      }

      /* « Bonjour » défile dans toutes les langues et se POSE sur celle de
         l'élève. C'est la promesse du produit en une seconde : PermiGo
         s'adresse d'abord à ceux qui ne parlent pas (encore) français.
         Liste choisie sur les langues réellement parlées par les élèves en
         France, fr/en/ar (les 3 de l'app) toujours dedans. */
      var go = sp.querySelector('.sp-go');
      var HI = [
        ['fr', 'Bonjour'], ['ar', 'مرحبا'], ['en', 'Hello'], ['pt', 'Olá'],
        ['es', 'Hola'], ['tr', 'Merhaba'], ['ro', 'Bună'], ['ru', 'Привет'],
        ['zh', '你好'], ['it', 'Ciao'], ['pl', 'Cześć'], ['vi', 'Xin chào'],
        ['de', 'Hallo'], ['hi', 'नमस्ते'], ['ta', 'வணக்கம்'], ['sw', 'Jambo']
      ];
      /* La langue de l'élève, dans l'ordre : le lien de campagne (?lang=), sa
         préférence enregistrée, puis son téléphone, sinon le français.
         Le `?lang=` est relu ici parce que ce script tourne AVANT le bundle —
         même règle que `langFromUrl()` dans src/utils/lang.js, garder les deux
         alignés. Seul fr/en/ar est accepté depuis l'URL : ce sont les langues
         que l'app parle vraiment. */
      var mine = (function () {
        var l = '';
        try {
          var h = location.hash || '';
          var hq = h.indexOf('?') >= 0 ? h.slice(h.indexOf('?') + 1) : '';
          var raw = new URLSearchParams(hq).get('lang') ||
                    new URLSearchParams(location.search).get('lang') || '';
          raw = raw.slice(0, 2).toLowerCase();
          if (raw === 'fr' || raw === 'en' || raw === 'ar') l = raw;
        } catch (e) { /* URLSearchParams indispo */ }
        if (!l) { try { l = localStorage.getItem('permigo_lang') || ''; } catch (e) { /* privé */ } }
        l = (l || navigator.language || 'fr').slice(0, 2).toLowerCase();
        for (var i = 0; i < HI.length; i++) if (HI[i][0] === l) return HI[i];
        return HI[0];
      })();
      var landed = false;
      function say(pair) {
        go.textContent = pair[1];
        go.setAttribute('lang', pair[0]);
      }
      function land() {                 // on finit TOUJOURS sur sa langue
        landed = true;
        say(mine);
      }
      say(HI[0]);

      function close() {
        if (closed) return;
        closed = true;
        land();                         // le dernier mot lu est le sien
        sp.classList.add('is-out');
        /* La page dessous a monté pendant que le splash couvrait l'écran : sa
           mise en scène s'est donc jouée sans témoin, et l'élève découvrait une
           page déjà posée qui apparaissait d'un bloc. On prévient ici, PENDANT
           le fondu, pour que le premier écran se lève au moment où le noir s'en
           va. Consommé par `wireReveal()` dans src/pages/public/pass.js. */
        document.dispatchEvent(new Event('permigo:splash-out'));
        var drop = function () { sp.remove(); };
        sp.addEventListener('transitionend', drop, { once: true });
        setTimeout(drop, 620); // filet si transitionend ne partait pas (sortie : 440 ms)
      }
      function fallback() {
        if (sp.classList.contains('is-fallback')) return;
        sp.classList.add('is-fallback'); // logo fixe (le poster)
        setTimeout(close, QUICK ? 200 : 600); // rien à regarder → on ne fait pas patienter
      }

      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
      if (reduce || !v) {
        setTimeout(close, QUICK ? 300 : 700); // mouvement réduit : pas de défilé
        return;
      }


      try { v.playbackRate = RATE; } catch (e) { /* refusé → vitesse normale */ }
      v.addEventListener('ended', close, { once: true });
      v.addEventListener('error', fallback, { once: true });

      var kick = function () {
        var p = v.play();
        if (p && p.catch) p.catch(fallback); // autoplay refusé → logo fixe
      };
      kick();
      v.addEventListener('canplay', kick, { once: true });
      // Décodage trop lent / lecture jamais partie → logo fixe plutôt que vide.
      setTimeout(function () { if (v.paused || !v.currentTime) fallback(); }, QUICK ? 450 : 900);

      /* On se cale sur le temps de la VIDÉO, pas sur un setTimeout : pendant le
         boot le thread principal est saturé et les timers dérivent (mesuré :
         +400 ms sur un cap de 1 750 ms). `currentTime`, lui, ne dérive pas.
         La même boucle fait défiler les « bonjour » — un setInterval dérivait
         tellement qu'on n'en voyait que 4 sur les 16. */
      var t0 = performance.now();
      var next = 0, hi = 0;
      (function watch() {
        if (closed) return;
        var el = performance.now() - t0;
        if (v.currentTime >= SEEN || el >= CAP) return close();
        // On se pose sur sa langue AVANT le fondu, pour qu'il ait le temps de
        // la lire en pleine opacité.
        if (!landed && (v.currentTime >= SEEN - LAND || el >= CAP - LAND * 1000)) land();
        else if (!landed && el >= next) {
          next = el + STEP;
          hi = (hi + 1) % HI.length;
          say(HI[hi]);
        }
        requestAnimationFrame(watch);
      })();
    })();
  </script>

  <div id="app" role="main" tabindex="-1"></div>

  <div id="toast-root" aria-live="polite"></div>

  <div id="modal-root"></div>

  <script type="module" src="/src/main.js"></script>
