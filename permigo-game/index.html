  <!-- ╔══ Écran de chargement (feu vert) — critical CSS inline ══╗
       Inliné ici (pas dans le bundle) pour s'afficher AVANT que le JS charge.
       Écran de MARQUE : toujours en vert PermiGo, indépendant de l'accent user. -->
  <style>
    #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--bg,#f4f5fb);padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);animation:spFade .3s ease;overflow:hidden}
    #splash::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 40%,rgba(88,204,2,.14),transparent 60%);pointer-events:none}
    #splash .tl-badge{width:84px;height:84px;animation:spFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 14px 26px rgba(70,163,2,.34))}
    #splash .tl-badge img{width:100%;height:100%;object-fit:contain;display:block}
    #splash .tl-housing{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:22px;background:linear-gradient(180deg,#23262b,#0d0e10);box-shadow:0 16px 34px rgba(10,12,18,.32),0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.08)}
    #splash .tl-lamp{width:36px;height:36px;border-radius:50%;background:#1b1c1e;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
    #splash .tl-lamp.r{animation:spRed 2.4s infinite}
    #splash .tl-lamp.y{animation:spAmber 2.4s infinite}
    #splash .tl-lamp.g{animation:spGreen 2.4s infinite}
    #splash .tl-go{font:800 17px/1 'Plus Jakarta Sans','Nunito',sans-serif;color:#46A302;letter-spacing:-.01em;opacity:0;animation:spGo 2.4s infinite}
    @keyframes spFade{from{opacity:0}to{opacity:1}}
    @keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes spRed{0%,26%{background:#ff4035;box-shadow:0 0 16px 3px #ff4035,inset 0 2px 5px rgba(0,0,0,.35)}32%,100%{background:#3a1413;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}}
    @keyframes spAmber{0%,28%{background:#2b2710}34%,44%{background:#ffc107;box-shadow:0 0 16px 3px #ffc107}50%,100%{background:#2b2710}}
    @keyframes spGreen{0%,50%{background:#12300f}58%,100%{background:#46e314;box-shadow:0 0 22px 6px rgba(70,227,20,.7)}}
    @keyframes spGo{0%,52%{opacity:0;transform:scale(.8)}62%,100%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){
      #splash .tl-badge{animation:none}
      #splash .tl-lamp.r,#splash .tl-lamp.y{animation:none;background:#2b2710;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
      #splash .tl-lamp.g{animation:none;background:#46e314;box-shadow:0 0 22px 6px rgba(70,227,20,.7)}
      #splash .tl-go{animation:none;opacity:1}
    }
  </style>
</head>
<body>
  <!-- A11y : skip link -->

  <!-- Container racine -->
  <div id="app" role="main" tabindex="-1">

      <div class="tl-housing" aria-hidden="true">
        <span class="tl-lamp r"></span>
        <span class="tl-lamp y"></span>
        <span class="tl-lamp g"></span>
      </div>
      <div class="tl-go" aria-hidden="true">C'est parti</div>
    </div>
  </div>
