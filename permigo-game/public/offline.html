<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>PermiGo. Hors ligne</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
      /* Archivo n'est pas garantie hors ligne : repli système assumé. */
      font-family: 'Archivo', system-ui, -apple-system, sans-serif;
      background: #f4f5fb; color: #1c1b2e; text-align: center; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #14122a; color: #f0eefc; } }
    .box { max-width: 320px; }
    /* Le lockup (globe + mot) est pré-caché par le service worker : il s'affiche hors ligne. */
    .logo { width: 178px; height: auto; margin: 0 auto 20px; display: block; }
    h1 { font-size: 20px; font-weight: 900; letter-spacing: -.02em; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 1.55; opacity: .75; margin: 0 0 22px; }
    button {
      font: 800 15px 'Archivo', system-ui, sans-serif; color: #fff; cursor: pointer;
      border: 0; border-radius: 14px; padding: 14px 28px;
      background: linear-gradient(180deg, #818cf8, #6366f1);
      box-shadow: 0 4px 0 #4338ca;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #4338ca; }
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/permigo-logo.png" alt="PermiGo" width="744" height="201" />
    <h1 id="ol-title">Tu es hors ligne</h1>
    <p id="ol-body">Pas de connexion pour le moment. Tes progrès t'attendent. Réessaie dès que le réseau revient.</p>
    <button id="ol-retry" onclick="location.reload()">Réessayer</button>
  </div>
  <script>
    // Page servie hors-ligne par le service worker (hors du système de modules) :
    // on traduit à la volée selon la langue mémorisée (miroir localStorage).
    (function () {
      try {
        var l = localStorage.getItem("permigo_lang");
        if (l !== "en" && l !== "ar") return;
        var T = {
          en: { t: "You're offline", b: "No connection right now. Your progress is waiting. Try again as soon as you're back online.", r: "Retry" },
          ar: { t: "أنت غير متصل", b: "لا اتصال حاليًا. تقدّمك في انتظارك. أعد المحاولة بمجرد عودة الشبكة.", r: "أعد المحاولة" }
        }[l];
        document.documentElement.lang = l;
        if (l === "ar") document.documentElement.dir = "rtl";
        document.getElementById("ol-title").textContent = T.t;
        document.getElementById("ol-body").textContent = T.b;
        document.getElementById("ol-retry").textContent = T.r;
      } catch (e) {}
    })();
  </script>
</body>
</html>
