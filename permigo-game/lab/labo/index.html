<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#181241" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Prototype local. Seule sortie autorisée : les polices de l'app
         (Baloo 2 + Inter), pour que le labo ait exactement la typo de PermiGo. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; media-src 'none'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Le labo de la conduite</title>
  </head>
  <body class="labo-page">
    <main id="labo" class="labo" aria-label="Le labo de la conduite"></main>
    <script type="module" src="/src/lab/labo/main.js"></script>
  </body>
</html>
