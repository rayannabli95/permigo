<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06060f" />
<title>PermiGo — Compétence acquise (Direction C · Route feu vert)</title>

<!-- Polices : titres lourds (Plus Jakarta Sans) + texte (Nunito) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     PermiGo — « Compétence acquise » · Direction C
     CINÉMATIQUE ROUTE / FEU VERT
     La compétence validée = une étape FRANCHIE sur la route.
     Un panneau routier s'allume en VERT « GO » au bord de la
     route de nuit qui file vers l'horizon. Keynote nocturne.
     ============================================================ */

  :root{
    /* Scène nuit */
    --sky-top:    #0b0d1f;
    --sky-mid:    #14122e;
    --sky-low:    #1a1640;
    --aurore-1:   #ffcaa0;   /* ambre doux au point de fuite */
    --aurore-2:   #ff9a6e;
    --aurore-3:   #7b6cff;   /* violet, queue d'aurore */

    /* VERT GO — le feu vert PermiGo */
    --go:         #58cc02;
    --go-soft:    #7ee63a;
    --go-bright:  #6fe016;
    --go-deep:    #46a302;
    --go-ink:     #0d2400;   /* texte foncé sur vert vif */

    /* Texte sur fond sombre (WCAG AA) */
    --ink:        #f4f3ff;
    --ink-soft:   #c8c6e6;
    --ink-mute:   #9a98bf;

    /* Verre dépoli sombre */
    --glass:      rgba(17, 15, 38, 0.60);
    --glass-edge: rgba(180, 170, 255, 0.18);

    --radius:     22px;
    --radius-sm:  15px;
    --ease:       cubic-bezier(.22,.61,.36,1);    /* « out » doux */
    --ease-spring:cubic-bezier(.34,1.56,.64,1);   /* léger rebond */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    font-family:"Nunito", system-ui, sans-serif;
    color:var(--ink);
    background:#06060f;          /* fond de page sombre autour du téléphone */
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ====================== CADRE TÉLÉPHONE ====================== */
  .phone{
    position:relative;
    width:390px; max-width:100vw;
    height:844px; max-height:calc(100svh - 32px);
    border-radius:44px;
    overflow:hidden;
    background:var(--sky-top);
    box-shadow:
      0 0 0 1px rgba(180,170,255,.10),
      0 40px 120px -30px rgba(0,0,0,.9),
      0 0 90px -20px rgba(88,204,2,.18);   /* halo vert ambiant autour du cadre */
  }
  /* Sur écran étroit, on laisse la scène coller aux bords */
  @media (max-width:430px){
    body{ padding:0; }
    .phone{ width:100vw; height:100svh; max-height:100svh; border-radius:0; }
  }

  /* La scène remplit le cadre */
  .stage{ position:absolute; inset:0; overflow:hidden; }

  /* ====================== DÉCOR : LA SCÈNE NUIT ====================== */
  .scene{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(120% 80% at 50% 100%, rgba(88,204,2,.14) 0%, transparent 55%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%);
    overflow:hidden;
  }

  /* Glow d'aurore / lueur chaude au point de fuite (horizon ~ 38%) */
  .aurore{
    position:absolute;
    left:50%; top:38%;
    width:min(560px, 150%); height:min(560px, 150%);
    transform:translate(-50%,-50%);
    background:
      radial-gradient(closest-side,
        rgba(255,240,220,.78) 0%,
        var(--aurore-1) 16%,
        var(--aurore-2) 36%,
        var(--aurore-3) 58%,
        transparent 74%);
    filter:blur(18px);
    opacity:.78;
    animation:aurorePulse 9s var(--ease) infinite;
    will-change:transform, opacity;
  }
  @keyframes aurorePulse{
    0%,100%{ opacity:.72; transform:translate(-50%,-50%) scale(1); }
    50%    { opacity:.92; transform:translate(-50%,-50%) scale(1.06); }
  }

  /* Bande de halo lumineux posée sur l'horizon — teintée vert GO */
  .horizon-glow{
    position:absolute; left:0; right:0; top:38%;
    height:120px; transform:translateY(-50%);
    background:linear-gradient(180deg, transparent, rgba(120,230,60,.16) 45%, rgba(88,204,2,.10) 100%);
    filter:blur(8px);
    mix-blend-mode:screen;
  }

  /* Étoiles discrètes (box-shadow, scintillent) */
  .stars{ position:absolute; inset:0 0 64% 0; }
  .stars::before,
  .stars::after{
    content:""; position:absolute; top:0; left:0; width:2px; height:2px; border-radius:50%;
    background:transparent;
  }
  .stars::before{
    box-shadow:
      30px 60px 0 0 rgba(255,255,255,.7),  92px 30px 0 0 rgba(255,255,255,.5),
      140px 88px 0 0 rgba(200,210,255,.6), 196px 44px 0 0 rgba(255,255,255,.45),
      250px 74px 0 0 rgba(255,255,255,.6), 300px 26px 0 0 rgba(210,210,255,.5),
      344px 64px 0 0 rgba(255,255,255,.55),60px 120px 0 0 rgba(255,255,255,.4),
      214px 116px 0 0 rgba(255,255,255,.4),124px 18px 0 0 rgba(255,255,255,.35);
    animation:twinkle 5.5s ease-in-out infinite;
  }
  .stars::after{
    box-shadow:
      18px 140px 0 0 rgba(255,255,255,.5), 112px 150px 0 0 rgba(220,220,255,.4),
      160px 20px 0 0 rgba(255,255,255,.5), 268px 132px 0 0 rgba(255,255,255,.35),
      320px 122px 0 0 rgba(255,255,255,.45),366px 40px 0 0 rgba(255,255,255,.4),
      44px 32px 0 0 rgba(255,255,255,.35), 206px 56px 0 0 rgba(255,255,255,.5);
    animation:twinkle 7s ease-in-out infinite reverse;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

  /* La ROUTE : trapèze qui part du bas et file vers le point de fuite */
  .road{
    position:absolute; left:50%; bottom:0; top:38%;
    width:100%;
    transform:translateX(-50%);
    perspective:520px;
    overflow:hidden;
  }
  .road__surface{
    position:absolute; left:50%; bottom:0;
    width:240%; height:200%;
    transform:translateX(-50%) rotateX(74deg);
    transform-origin:bottom center;
    background:linear-gradient(180deg, rgba(26,22,64,0) 0%, #15122e 30%, #0c0a22 100%);
  }
  /* Bords lumineux de la route (rails néon) — VERT GO ici (feu vert) */
  .road__edge{
    position:absolute; bottom:0; width:3px; height:54%;
    background:linear-gradient(0deg, rgba(88,204,2,0), rgba(110,224,40,.85) 55%, rgba(180,255,140,.95));
    filter:blur(.4px);
    box-shadow:0 0 14px rgba(88,204,2,.75);
    opacity:0;                                   /* éteints au départ, s'allument à l'entrée */
    animation:railOn 1s var(--ease) .25s forwards;
  }
  .road__edge.l{ left:50%; transform:translateX(-50%); transform-origin:bottom; rotate:18deg; }
  .road__edge.r{ left:50%; transform:translateX(-50%); transform-origin:bottom; rotate:-18deg; }
  @keyframes railOn{ to{ opacity:1; } }

  /* Lignes centrales pointillées, défilant vers le spectateur */
  .road__lines{
    position:absolute; left:50%; bottom:0;
    width:14px; height:60%;
    transform:translateX(-50%);
    background:repeating-linear-gradient(
      to top,
      rgba(245,255,235,.92) 0 5%,
      transparent 5% 12%);
    -webkit-mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.25) 78%, transparent 100%);
            mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.25) 78%, transparent 100%);
    clip-path:polygon(38% 100%, 62% 100%, 51% 0, 49% 0);
    opacity:0;
    animation:linesOn .8s var(--ease) .35s forwards, dash 1.5s linear .35s infinite;
  }
  @keyframes linesOn{ to{ opacity:.9; } }
  @keyframes dash{ from{ background-position:0 0; } to{ background-position:0 360px; } }

  /* Halos de phares diffus */
  .lamp{ position:absolute; border-radius:50%; filter:blur(40px); mix-blend-mode:screen; pointer-events:none; }
  .lamp.a{ width:220px; height:220px; left:-50px; top:46%; background:radial-gradient(closest-side, rgba(120,230,60,.42), transparent); }
  .lamp.b{ width:240px; height:240px; right:-60px; top:58%; background:radial-gradient(closest-side, rgba(255,200,150,.30), transparent); animation:drift 11s var(--ease) infinite; }
  .lamp.c{ width:300px; height:300px; left:50%; bottom:-40px; transform:translateX(-50%); background:radial-gradient(closest-side, rgba(88,204,2,.30), transparent); }
  @keyframes drift{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(20px); } }

  /* Vignette pour focaliser le regard sur le panneau */
  .vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(115% 80% at 50% 40%, transparent 40%, rgba(4,4,14,.62) 100%);
  }

  /* ====================== CONTENU ====================== */
  .ui{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column;
    padding:max(20px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
  }

  /* Logo discret en haut */
  .topbar{ display:flex; align-items:center; justify-content:center; height:30px; flex:none; }
  .topbar img{ height:22px; width:auto; filter:drop-shadow(0 4px 14px rgba(88,204,2,.45)); opacity:.95; }
  .topbar .logo-fallback{
    display:none; font-family:"Plus Jakarta Sans", sans-serif; font-weight:800; font-size:18px;
    letter-spacing:-.3px; color:var(--ink);
    text-shadow:0 4px 16px rgba(88,204,2,.5);
  }
  .topbar img.is-broken{ display:none; }
  .topbar img.is-broken + .logo-fallback{ display:inline-block; }

  /* ----- La scène focal : le panneau au bord de la route ----- */
  .focal{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; min-height:0; }

  /* Kicker vert espacé */
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"Nunito", sans-serif; font-weight:800; font-size:12.5px;
    letter-spacing:2.4px; text-transform:uppercase;
    color:var(--go-soft);
    opacity:0; animation:kickerIn .7s var(--ease) .55s both;
  }
  .kicker .tick{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%;
    background:linear-gradient(160deg, var(--go-soft), var(--go-deep));
    box-shadow:0 0 12px rgba(88,204,2,.8);
  }
  .kicker .tick svg{ width:12px; height:12px; color:#fff; }
  @keyframes kickerIn{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:translateY(0); } }

  /* === LE PANNEAU ROUTIER PREMIUM === */
  .sign-wrap{
    position:relative;
    margin:14px 0 4px;
    display:flex; flex-direction:column; align-items:center;
    /* le panneau se dresse depuis le bas + petit overshoot */
    transform-origin:bottom center;
    opacity:0;
    animation:signRise .85s var(--ease-spring) .6s both;
  }
  @keyframes signRise{
    from{ opacity:0; transform:translateY(26px) scaleY(.86) rotateX(8deg); }
    60% { opacity:1; }
    to  { opacity:1; transform:translateY(0) scaleY(1) rotateX(0); }
  }

  /* Halo vert qui « monte » et entoure le panneau allumé */
  .sign-wrap::before{
    content:""; position:absolute; left:50%; top:46%; z-index:-1;
    width:280px; height:200px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(88,204,2,.55), rgba(88,204,2,.16) 55%, transparent 78%);
    filter:blur(10px);
    opacity:0;
    animation:glowUp 1.1s var(--ease) 1s forwards, goBreathe 3.4s var(--ease) 2.1s infinite;
  }
  @keyframes glowUp{ from{ opacity:0; transform:translate(-50%,-30%) scale(.6); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
  @keyframes goBreathe{ 0%,100%{ opacity:.85; } 50%{ opacity:1; } }

  /* Le panneau lui-même : grand panneau directionnel autoroute */
  .sign{
    position:relative;
    width:300px; max-width:78vw;
    padding:18px 20px 20px;
    border-radius:18px;
    background:
      linear-gradient(180deg, rgba(20,40,8,.96), rgba(11,26,4,.98));
    /* bordure rétro-réfléchissante verte allumée */
    border:2.5px solid rgba(126,230,58,.85);
    box-shadow:
      0 0 0 4px rgba(11,26,4,.9),                 /* contour sombre type panneau */
      0 0 26px -2px rgba(88,204,2,.7),            /* glow vert allumé */
      0 26px 50px -18px rgba(0,0,0,.85) inset,
      0 1px 0 rgba(180,255,140,.25) inset;
  }
  /* liseré lumineux interne (effet rétro-réfléchissant) */
  .sign::before{
    content:""; position:absolute; inset:5px;
    border-radius:12px;
    border:1.5px solid rgba(160,255,110,.30);
    box-shadow:0 0 16px rgba(88,204,2,.35) inset;
    pointer-events:none;
  }
  /* reflet lumineux qui balaye la surface */
  .sign::after{
    content:""; position:absolute; inset:0; border-radius:18px; overflow:hidden;
    background:linear-gradient(120deg, transparent 38%, rgba(200,255,170,.22) 50%, transparent 62%);
    transform:translateX(-110%);
    animation:signSheen 1.1s var(--ease) 1.5s both;
    pointer-events:none;
  }
  @keyframes signSheen{ to{ transform:translateX(110%); } }

  /* En-tête panneau : feu vert allumé + coche */
  .sign__head{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:12px;
  }
  /* petit feu vert rond allumé (la « lampe » du feu) */
  .go-light{
    position:relative;
    width:26px; height:26px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 38% 32%, var(--go-soft), var(--go) 55%, var(--go-deep));
    box-shadow:
      0 0 0 3px rgba(11,26,4,.9),
      0 0 18px 2px rgba(88,204,2,.9);
    animation:goBlink 2.6s ease-in-out 2s infinite;
  }
  @keyframes goBlink{ 0%,100%{ box-shadow:0 0 0 3px rgba(11,26,4,.9), 0 0 18px 2px rgba(88,204,2,.9); } 50%{ box-shadow:0 0 0 3px rgba(11,26,4,.9), 0 0 26px 4px rgba(120,230,60,1); } }
  .sign__check{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%; flex:none;
    background:linear-gradient(160deg, var(--go-soft), var(--go-deep));
    box-shadow:0 0 16px rgba(88,204,2,.7), 0 2px 6px rgba(0,0,0,.5);
  }
  .sign__check svg{ width:17px; height:17px; color:#fff; }

  /* Titre de la compétence sur le panneau */
  .sign__title{
    position:relative; z-index:1;
    font-family:"Plus Jakarta Sans", sans-serif; font-weight:800;
    font-size:23px; line-height:1.18; letter-spacing:-.3px;
    text-align:center;
    color:#eafce0;
    text-shadow:0 0 18px rgba(88,204,2,.45), 0 2px 4px rgba(0,0,0,.5);
  }

  /* Poteau du panneau */
  .post{
    width:9px; height:46px;
    background:linear-gradient(90deg, #2a2740, #4a466a 50%, #2a2740);
    border-radius:0 0 3px 3px;
    box-shadow:0 6px 14px -4px rgba(0,0,0,.6);
  }
  /* socle / ombre au sol */
  .post-base{
    width:120px; height:14px; margin-top:-3px;
    border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.55), transparent 72%);
    filter:blur(2px);
  }

  /* Cartouche sous-titre « C3 · Montagne » */
  .cartouche{
    display:inline-flex; align-items:center; gap:7px;
    margin-top:14px; padding:7px 14px;
    border-radius:999px;
    background:rgba(17,15,38,.55);
    border:1px solid rgba(126,230,58,.30);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-family:"Nunito", sans-serif; font-weight:800; font-size:13.5px;
    color:var(--ink-soft); letter-spacing:.3px;
    box-shadow:0 0 18px -6px rgba(88,204,2,.45);
    opacity:0; animation:fadeUp .7s var(--ease) 1.1s both;
  }
  .cartouche .dot{ width:6px; height:6px; border-radius:50%; background:var(--go-soft); box-shadow:0 0 8px var(--go); }

  /* ----- Bloc bas : stats + barre + CTA (sur verre) ----- */
  .panel{ flex:none; display:flex; flex-direction:column; gap:14px; padding-top:6px; }

  /* Stats : 2 cartes verre dépoli sombre */
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat{
    position:relative;
    padding:14px 14px 13px;
    border-radius:var(--radius-sm);
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid var(--glass-edge);
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 18px 40px -22px rgba(0,0,0,.8);
    opacity:0;
  }
  .stat.s1{ animation:fadeUp .6s var(--ease) 1.2s both; }
  .stat.s2{ animation:fadeUp .6s var(--ease) 1.32s both; }
  .stat__label{
    display:flex; align-items:center; gap:7px;
    font-size:11.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    color:var(--ink-mute);
  }
  .stat__label svg{ width:14px; height:14px; color:var(--go-soft); }
  .stat__value{
    margin-top:7px;
    font-family:"Plus Jakarta Sans", sans-serif; font-weight:800;
    font-size:26px; line-height:1; letter-spacing:-.5px;
    color:var(--ink);
  }
  .stat__value .unit{ font-size:16px; color:var(--ink-soft); font-weight:700; margin-left:1px; }
  .stat__value .frac{ font-size:16px; color:var(--ink-soft); font-weight:700; }

  /* Barre « Permis virtuel » */
  .progress{
    padding:14px 16px;
    border-radius:var(--radius-sm);
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid var(--glass-edge);
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 18px 40px -22px rgba(0,0,0,.8);
    opacity:0; animation:fadeUp .6s var(--ease) 1.42s both;
  }
  .progress__top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .progress__label{
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:800; color:var(--ink-soft); letter-spacing:.2px;
  }
  .progress__label svg{ width:16px; height:16px; color:var(--go-soft); }
  .progress__pct{
    font-family:"Plus Jakarta Sans", sans-serif; font-weight:800; font-size:15px;
    color:var(--go-soft); text-shadow:0 0 12px rgba(88,204,2,.5);
  }
  .progress__track{
    position:relative; height:11px; border-radius:999px; overflow:hidden;
    background:rgba(8,8,22,.85);
    box-shadow:0 1px 2px rgba(0,0,0,.5) inset, 0 0 0 1px rgba(180,170,255,.10);
  }
  .progress__fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--go-deep), var(--go) 55%, var(--go-soft));
    box-shadow:0 0 16px 1px rgba(88,204,2,.85), 0 0 0 1px rgba(180,255,140,.3) inset;
    transition:width 1.1s var(--ease);
  }
  /* reflet qui glisse dans la barre */
  .progress__fill::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
    transform:translateX(-100%);
    animation:barSheen 2.6s var(--ease) 2.6s infinite;
  }
  @keyframes barSheen{ 0%{ transform:translateX(-100%); } 60%,100%{ transform:translateX(180%); } }

  /* CTA + lien secondaire */
  .actions{ display:flex; flex-direction:column; align-items:center; gap:11px; padding-top:2px;
            opacity:0; animation:fadeUp .6s var(--ease) 1.55s both; }
  .cta{
    position:relative; width:100%; min-height:56px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:"Plus Jakarta Sans", sans-serif; font-weight:800; font-size:17px;
    color:var(--go-ink); letter-spacing:.2px;
    border:0; border-radius:16px; cursor:pointer;
    background:linear-gradient(135deg, var(--go-bright) 0%, var(--go) 48%, var(--go-deep) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 14px 30px -8px rgba(88,204,2,.65),
      0 0 28px -6px rgba(88,204,2,.5);
    overflow:hidden;
    transition:transform .18s var(--ease), box-shadow .25s var(--ease), filter .2s var(--ease);
  }
  /* balayage lumineux au hover */
  .cta::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
    transform:translateX(-120%); transition:transform .7s var(--ease);
  }
  .cta:hover{
    transform:translateY(-2px); filter:brightness(1.05);
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 20px 42px -8px rgba(88,204,2,.85), 0 0 40px -4px rgba(88,204,2,.7);
  }
  .cta:hover::before{ transform:translateX(120%); }
  .cta:active{ transform:translateY(0) scale(.985); }
  .cta:focus-visible{ outline:3px solid rgba(255,255,255,.7); outline-offset:3px; }
  .cta svg{ width:19px; height:19px; }

  .link{
    background:none; border:0; cursor:pointer;
    font-family:"Nunito", sans-serif; font-size:14px; font-weight:700;
    color:var(--ink-mute); letter-spacing:.2px;
    padding:6px 10px; border-radius:8px;
    transition:color .2s var(--ease);
  }
  .link:hover{ color:var(--ink-soft); }
  .link:focus-visible{ outline:2px solid var(--go-soft); outline-offset:2px; }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

  /* ====================== REDUCED MOTION ====================== */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation:none !important;
      transition-duration:.01ms !important;
    }
    .road__edge, .road__lines, .sign-wrap, .kicker, .cartouche,
    .stat, .progress, .actions, .sign-wrap::before{ opacity:1 !important; }
    .road__lines{ background-position:0 0 !important; opacity:.9 !important; }
    .progress__fill{ width:58% !important; }
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="stage">

      <!-- ===== DÉCOR : la route de nuit vers le permis ===== -->
      <div class="scene" aria-hidden="true">
        <div class="stars"></div>
        <div class="aurore"></div>
        <div class="horizon-glow"></div>
        <div class="road">
          <div class="road__surface"></div>
          <div class="road__edge l"></div>
          <div class="road__edge r"></div>
          <div class="road__lines"></div>
        </div>
        <span class="lamp a"></span>
        <span class="lamp b"></span>
        <span class="lamp c"></span>
      </div>
      <div class="vignette" aria-hidden="true"></div>

      <!-- ===== CONTENU ===== -->
      <div class="ui">

        <!-- Logo discret -->
        <div class="topbar">
          <img src="../public/permigo-logo.png" alt="PermiGo"
               onerror="this.classList.add('is-broken')" />
          <span class="logo-fallback" aria-hidden="true">PermiGo</span>
        </div>

        <!-- FOCAL : le panneau qui s'allume vert au bord de la route -->
        <div class="focal">

          <span class="kicker">
            <span class="tick" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
                   stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            Compétence acquise
          </span>

          <div class="sign-wrap">
            <div class="sign">
              <div class="sign__head">
                <span class="go-light" aria-hidden="true"></span>
                <span class="sign__check" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
                       stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
              </div>
              <h1 class="sign__title">S'insérer sur<br>l'autoroute</h1>
            </div>
            <div class="post" aria-hidden="true"></div>
            <div class="post-base" aria-hidden="true"></div>
          </div>

          <span class="cartouche">
            <span class="dot" aria-hidden="true"></span>
            C3 · Montagne
          </span>
        </div>

        <!-- Bloc bas : stats + barre + CTA -->
        <div class="panel">

          <div class="stats">
            <div class="stat s1">
              <span class="stat__label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                Score
              </span>
              <div class="stat__value"><span id="scoreVal">0</span><span class="unit">%</span></div>
            </div>
            <div class="stat s2">
              <span class="stat__label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 21v-4a4 4 0 0 1 8 0v4"/><circle cx="12" cy="7" r="4" opacity="0"/>
                  <path d="M3 6h4l2 3 5-8 2 5h5"/>
                </svg>
                Acquises
              </span>
              <div class="stat__value"><span id="acqVal">0</span><span class="frac"> / 31</span></div>
            </div>
          </div>

          <div class="progress">
            <div class="progress__top">
              <span class="progress__label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M7 15h4"/>
                </svg>
                Permis virtuel
              </span>
              <span class="progress__pct" id="progPct">58 %</span>
            </div>
            <div class="progress__track">
              <div class="progress__fill" id="progFill"></div>
            </div>
          </div>

          <div class="actions">
            <button type="button" class="cta">
              Continuer
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
              </svg>
            </button>
            <button type="button" class="link">Voir mon parcours</button>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script>
    (function(){
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Barre « Permis virtuel » : se remplit jusqu'à 58 %
      const fill = document.getElementById('progFill');
      if (reduce){
        fill.style.width = '58%';
      } else {
        // démarre après l'apparition de la barre
        setTimeout(() => { fill.style.width = '58%'; }, 1500);
      }

      // Compteurs animés : Score 0→100, Acquises 0→18
      function countTo(el, target, duration, suffix){
        if (reduce){ el.textContent = target + (suffix||''); return; }
        const start = performance.now();
        const ease = t => 1 - Math.pow(1 - t, 3);   // ease-out cubic
        function step(now){
          const p = Math.min(1, (now - start) / duration);
          el.textContent = Math.round(ease(p) * target) + (suffix||'');
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      const scoreEl = document.getElementById('scoreVal');
      const acqEl   = document.getElementById('acqVal');
      // léger délai pour caler avec l'entrée des stats (~1.2s)
      setTimeout(() => {
        countTo(scoreEl, 100, 1100);
        countTo(acqEl, 18, 1100);
      }, reduce ? 0 : 1250);
    })();
  </script>
</body>
</html>
