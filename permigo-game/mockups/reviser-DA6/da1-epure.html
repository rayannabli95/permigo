<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Réviser — Épuré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#6c63ff;
    --accent-dk:#4a3fc9;
    --bg:#f4f5fb;
    --surface:#ffffff;
    --surface2:#f8f9fd;
    --border:#e2e6f2;
    --ink:#0b0d1a;
    --muted:#5f6788;
    --gold:#e0a028;
    --green:#0f9d67;
    --orange:#d97a2b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{
    width:390px;margin:0 auto;min-height:844px;
    background:var(--bg);
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .screen{
    padding:0 22px calc(28px + env(safe-area-inset-bottom));
    padding-top:calc(20px + env(safe-area-inset-top));
  }

  /* ===== Top bar ===== */
  .top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;
  }
  .h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:30px;letter-spacing:-.03em;
    line-height:1;color:var(--ink);
  }
  .streak{
    display:inline-flex;align-items:center;gap:6px;
    height:34px;padding:0 13px 0 10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    font-weight:700;font-size:13px;color:var(--ink);
    letter-spacing:-.01em;
  }
  .streak svg{display:block;}

  /* ===== Hero ===== */
  .hero{margin-bottom:26px;}
  .hero-frame{
    position:relative;
    height:206px;
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .hero-frame img{
    width:100%;height:100%;
    object-fit:cover;object-position:center 8%;
    display:block;
  }
  .fav{
    position:absolute;top:12px;left:12px;
    display:inline-flex;align-items:center;
    height:26px;padding:0 11px;
    background:var(--accent);
    color:#fff;
    border-radius:8px;
    font-weight:800;font-size:11px;
    letter-spacing:.01em;
    box-shadow:0 4px 12px rgba(108,99,255,.28);
  }

  .hero-body{padding:18px 2px 0;}
  .over{
    display:block;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:11px;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .hero-title{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:23px;letter-spacing:-.03em;
    line-height:1.08;color:var(--ink);
    margin-bottom:7px;
  }
  .hero-sub{
    font-weight:600;font-size:14px;line-height:1.35;
    color:var(--muted);
    margin-bottom:16px;
    max-width:300px;
  }
  .cta{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;height:52px;
    background:var(--accent);
    color:#fff;
    border:none;border-radius:14px;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:16px;letter-spacing:-.01em;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(108,99,255,.24);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(108,99,255,.20);}
  .cta svg{display:block;}

  /* ===== Ruled list ===== */
  .list{
    border-top:1px solid var(--border);
  }
  .row{
    display:flex;align-items:center;gap:14px;
    padding:15px 2px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    background:transparent;
    width:100%;text-align:left;border-left:none;border-right:none;border-top:none;
    font-family:inherit;
    transition:background .12s ease;
  }
  .row:active{background:var(--surface2);}
  .ic{
    flex:0 0 44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--accent-dk);
  }
  .ic svg{display:block;}
  .txt{flex:1 1 auto;min-width:0;}
  .row-title{
    display:block;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:15px;letter-spacing:-.01em;
    color:var(--ink);
    line-height:1.2;
    margin-bottom:2px;
  }
  .row-sub{
    display:block;
    font-weight:600;font-size:12px;color:var(--muted);
    line-height:1.25;
  }
  .meta{
    display:flex;align-items:center;gap:9px;
    flex:0 0 auto;
  }
  .meta-val{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:13px;letter-spacing:-.01em;
    white-space:nowrap;
  }
  .meta-val.gold{color:var(--gold);}
  .meta-val.green{color:var(--green);}
  .meta-val.orange{color:var(--orange);}
  .chev{color:#b7bed6;flex:0 0 auto;}
  .chev svg{display:block;}
</style>
</head>
<body>
  <div class="screen">

    <div class="top">
      <h1 class="h1">Réviser</h1>
      <span class="streak">
        <svg width="15" height="17" viewBox="0 0 15 17" fill="none">
          <path d="M7.5 1c1.4 2.5.4 3.9-.9 5.2C4.9 7.9 3 9.5 3 12a4.5 4.5 0 0 0 9 0c0-1.5-.7-2.6-1.4-3.5-.3.7-.9 1.1-1.6 1.1.9-2 .1-4.4-1.5-6.6-.5-.7-.7-1.3 0-2Z" fill="#e0a028"/>
          <path d="M7.5 15a2.6 2.6 0 0 1-2.6-2.6c0-1.4 1-2.2 1.6-3.1.4.6 1 .9 1.7.9.4 1-.1 1.9.3 2.6.6-.2.9-.7 1-1.3.4.5.6 1.2.6 1.9A2.6 2.6 0 0 1 7.5 15Z" fill="#f5c542"/>
        </svg>
        Série 5 j
      </span>
    </div>

    <!-- HÉROS -->
    <section class="hero">
      <div class="hero-frame">
        <span class="fav">Le préféré des élèves</span>
        <img src="assets/eleve-en-situation.png" alt="Scène de croisement du mini-jeu En situation">
      </div>
      <div class="hero-body">
        <span class="over">Mise en situation · 59 scènes</span>
        <h2 class="hero-title">Une scène, une décision</h2>
        <p class="hero-sub">3 min, comme sur la route — pas du code.</p>
        <button class="cta">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 2.8v10.4c0 .6.66.98 1.18.68l8.5-5.2a.8.8 0 0 0 0-1.36l-8.5-5.2A.8.8 0 0 0 4 2.8Z" fill="#fff"/>
          </svg>
          Jouer une scène
        </button>
      </div>
    </section>

    <!-- SECONDAIRES -->
    <nav class="list">

      <button class="row">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
            <path d="M14 3v5h5"/>
            <path d="M9 13.5l1.8 1.8L14 12"/>
          </svg>
        </span>
        <span class="txt">
          <span class="row-title">Examen blanc</span>
          <span class="row-sub">Comme le jour J, noté sur 31</span>
        </span>
        <span class="meta">
          <span class="meta-val gold">Record 87 %</span>
          <span class="chev"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></span>
        </span>
      </button>

      <button class="row">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H12v16H5.5A1.5 1.5 0 0 0 4 20.5V4.5Z"/>
            <path d="M20 4.5A1.5 1.5 0 0 0 18.5 3H12v16h6.5a1.5 1.5 0 0 1 1.5 1.5V4.5Z"/>
          </svg>
        </span>
        <span class="txt">
          <span class="row-title">Fiches de révision</span>
          <span class="row-sub">Le geste, pas le code</span>
        </span>
        <span class="meta">
          <span class="meta-val green">12 / 31</span>
          <span class="chev"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></span>
        </span>
      </button>

      <button class="row">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z"/>
            <circle cx="12" cy="10" r="2.6"/>
          </svg>
        </span>
        <span class="txt">
          <span class="row-title">Centre d'examen</span>
          <span class="row-sub">Ton centre, le jour J</span>
        </span>
        <span class="meta">
          <span class="meta-val orange">Cergy 95</span>
          <span class="chev"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></span>
        </span>
      </button>

    </nav>

  </div>
</body>
</html>
