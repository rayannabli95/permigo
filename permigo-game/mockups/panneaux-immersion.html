<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PermiGo — Mon parcours (mockup immersif)</title>
<style>
  /* =============================================
     RESET + FONTS
  ============================================= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root {
    --green: #58CC02;
    --green-dark: #3d9900;
    --green-shadow: rgba(88, 204, 2, 0.35);
    --green-glow: rgba(88, 204, 2, 0.18);
    --bg: #f4f5fb;
    --surface: #ffffff;
    --text-primary: #1a1d23;
    --text-secondary: #6b7280;
    --radius-node: 18px;
    --node-size: 68px;
    --font-title: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }

  body {
    background: #e8e9f2;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 32px 16px 64px;
    font-family: var(--font-body);
  }

  /* =============================================
     PHONE SHELL
  ============================================= */
  .phone-shell {
    width: 390px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 44px;
    box-shadow:
      0 0 0 10px #1a1d23,
      0 0 0 12px #2c2f38,
      0 32px 80px rgba(0,0,0,0.38),
      0 8px 20px rgba(0,0,0,0.18);
    overflow: hidden;
    position: relative;
  }

  /* Notch */
  .phone-notch {
    width: 126px;
    height: 36px;
    background: #1a1d23;
    border-radius: 0 0 22px 22px;
    margin: 0 auto;
    position: relative;
    z-index: 20;
  }

  /* =============================================
     APP HEADER
  ============================================= */
  .app-header {
    background: var(--surface);
    padding: 14px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: relative;
    z-index: 10;
  }

  .header-back {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .header-back svg { display: block; }

  .header-title {
    font-family: var(--font-title);
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .header-xp {
    background: var(--green);
    color: #fff;
    font-family: var(--font-title);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  /* =============================================
     SCROLL AREA
  ============================================= */
  .scroll-area {
    height: 720px;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    scrollbar-width: none;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* =============================================
     BACKGROUND FIELD — panneaux immersifs
  ============================================= */
  .signs-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* Panneau générique */
  .sign {
    position: absolute;
    background: transparent;
    will-change: transform;
  }

  /* Couche LOINTAINE — petits, très flous, très transparents */
  .sign--far {
    width: 28px;
    height: 28px;
    opacity: 0.06;
    filter: blur(2.5px) saturate(0.4);
  }

  /* Couche MOYENNE — taille intermédiaire, légèrement flou */
  .sign--mid {
    width: 46px;
    height: 46px;
    opacity: 0.10;
    filter: blur(1px) saturate(0.6);
  }

  /* Couche PROCHE — plus grand, net, légèrement teinté */
  .sign--near {
    width: 62px;
    height: 62px;
    opacity: 0.13;
    filter: blur(0px) saturate(0.7);
  }

  /* Quelques accents verts très légers pour l'ambiance */
  .sign--accent {
    filter: blur(0px) saturate(1.1) hue-rotate(10deg) !important;
    opacity: 0.08 !important;
  }

  /* Animation CSS flottement très discret */
  @keyframes float-a {
    0%, 100% { transform: var(--rot) translateY(0px); }
    50%       { transform: var(--rot) translateY(-5px); }
  }
  @keyframes float-b {
    0%, 100% { transform: var(--rot) translateY(0px); }
    50%       { transform: var(--rot) translateY(4px); }
  }
  @keyframes float-c {
    0%, 100% { transform: var(--rot) translateY(0px) translateX(0px); }
    33%       { transform: var(--rot) translateY(-3px) translateX(2px); }
    66%       { transform: var(--rot) translateY(3px) translateX(-2px); }
  }

  .sign { animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .sign--far  { animation-name: float-a; animation-duration: 8s; }
  .sign--mid  { animation-name: float-b; animation-duration: 11s; }
  .sign--near { animation-name: float-c; animation-duration: 14s; }

  /* Pause si reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    .sign { animation: none !important; }
  }

  /* =============================================
     ROUTE ZIGZAG CANVAS
  ============================================= */
  .route-canvas {
    position: relative;
    z-index: 2;
    width: 100%;
    /* Hauteur totale du scrollable */
    padding-bottom: 60px;
  }

  /* SVG tracé route */
  .route-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* =============================================
     NODES (tuiles)
  ============================================= */
  .nodes-layer {
    position: relative;
    z-index: 3;
  }

  /* Conteneur positionné pour chaque node */
  .node-wrap {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transform: translateX(-50%);
  }

  /* Tuile principale */
  .node-tile {
    width: var(--node-size);
    height: var(--node-size);
    border-radius: var(--radius-node);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 4px 0px 0px rgba(0,0,0,0.14),
      0 6px 18px rgba(0,0,0,0.10),
      0 0 0 2px rgba(255,255,255,0.8);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease;
  }

  /* Lettre P */
  .node-letter {
    font-family: var(--font-title);
    font-size: 26px;
    font-weight: 800;
    color: var(--green);
    line-height: 1;
    letter-spacing: -1px;
  }

  /* Petit point indicateur sous la lettre */
  .node-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    margin-top: 2px;
  }

  /* Shadow 3D verte sous la tuile */
  .node-tile::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 6px;
    right: 6px;
    height: 8px;
    background: var(--green-dark);
    border-radius: 0 0 var(--radius-node) var(--radius-node);
    z-index: -1;
    filter: blur(1px);
  }

  /* Variante : node validée */
  .node-tile--done {
    background: linear-gradient(145deg, #58CC02, #4ab800);
  }
  .node-tile--done .node-letter { color: #fff; }
  .node-tile--done .node-dot { background: rgba(255,255,255,0.7); }
  .node-tile--done::after { background: #2e7a00; }

  /* Variante : node verrouillée */
  .node-tile--locked {
    background: #e5e7eb;
    box-shadow:
      0 4px 0px 0px rgba(0,0,0,0.10),
      0 6px 14px rgba(0,0,0,0.06),
      0 0 0 2px rgba(255,255,255,0.6);
  }
  .node-tile--locked .node-letter { color: #9ca3af; }
  .node-tile--locked .node-dot { background: #9ca3af; }
  .node-tile--locked::after { background: #c4c7ce; }

  /* Variante : node active (TU ES ICI) */
  .node-tile--active {
    background: var(--surface);
    box-shadow:
      0 4px 0px 0px var(--green-dark),
      0 6px 24px var(--green-shadow),
      0 0 0 3px var(--green),
      0 0 32px var(--green-glow);
    animation: pulse-node 2.4s ease-in-out infinite;
  }
  .node-tile--active .node-letter { color: var(--green); }

  @keyframes pulse-node {
    0%, 100% { box-shadow: 0 4px 0px 0px var(--green-dark), 0 6px 24px var(--green-shadow), 0 0 0 3px var(--green), 0 0 32px var(--green-glow); }
    50%       { box-shadow: 0 4px 0px 0px var(--green-dark), 0 6px 32px rgba(88,204,2,0.50), 0 0 0 3px var(--green), 0 0 48px rgba(88,204,2,0.28); }
  }

  @media (prefers-reduced-motion: reduce) {
    .node-tile--active { animation: none; }
  }

  /* =============================================
     LABELS
  ============================================= */
  .node-label {
    background: var(--surface);
    border-radius: 16px;
    padding: 6px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    white-space: nowrap;
    max-width: 160px;
    text-align: center;
  }

  .node-label-text {
    font-family: var(--font-title);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .node-label--active {
    background: var(--green);
    box-shadow: 0 3px 12px var(--green-shadow);
  }
  .node-label--active .node-label-text { color: #fff; }

  .node-label--done {
    background: rgba(88, 204, 2, 0.08);
    border: 1px solid rgba(88, 204, 2, 0.25);
  }
  .node-label--done .node-label-text { color: var(--green-dark); }

  /* Check icon pour nodes validées */
  .node-check {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 20px;
    height: 20px;
    background: var(--green);
    border-radius: 50%;
    border: 2px solid var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
  }
  .node-check svg { display: block; }

  /* Streak badge sur node active */
  .node-streak {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #FF9500;
    color: #fff;
    font-family: var(--font-title);
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 10px;
    border: 2px solid var(--surface);
    z-index: 4;
    white-space: nowrap;
  }

  /* =============================================
     PROGRESS BAR SECTION
  ============================================= */
  .progress-section {
    background: var(--surface);
    margin: 0 16px;
    border-radius: 20px;
    padding: 14px 18px;
    position: relative;
    z-index: 5;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .progress-icon {
    width: 40px;
    height: 40px;
    background: rgba(88,204,2,0.10);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .progress-info { flex: 1; }

  .progress-label {
    font-family: var(--font-title);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .progress-bar-bg {
    height: 8px;
    background: #e8e9f2;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 38%;
    background: linear-gradient(90deg, #58CC02, #7de800);
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .progress-pct {
    font-family: var(--font-title);
    font-size: 13px;
    font-weight: 800;
    color: var(--green);
    flex-shrink: 0;
  }

  /* =============================================
     WORLD HEADER (section titre)
  ============================================= */
  .world-header {
    position: relative;
    z-index: 5;
    padding: 20px 20px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .world-badge {
    background: var(--green);
    color: #fff;
    font-family: var(--font-title);
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .world-name {
    font-family: var(--font-title);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }

  /* =============================================
     BOTTOM NAV
  ============================================= */
  .bottom-nav {
    background: var(--surface);
    border-top: 1px solid rgba(0,0,0,0.07);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 0 20px;
    position: relative;
    z-index: 10;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 12px;
    transition: background 0.15s;
  }

  .nav-item--active { background: rgba(88,204,2,0.08); }

  .nav-label {
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .nav-item--active .nav-label { color: var(--green); font-weight: 700; }

  /* =============================================
     HELPERS
  ============================================= */
  .sr-only {
    position: absolute; width:1px; height:1px;
    overflow: hidden; clip: rect(0,0,0,0);
  }
</style>
</head>

<div class="phone-shell" role="main" aria-label="Mockup Mon parcours">
  <!-- Notch -->
  <div class="phone-notch" aria-hidden="true"></div>

  <!-- Header app -->
  <header class="app-header">
    <div class="header-back" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M11 4L6 9L11 14" stroke="#1a1d23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="header-title">Mon parcours</span>
    <div class="header-xp" aria-label="1 240 points XP">1 240 XP</div>
  </header>

  <!-- Barre de progression globale -->

    <div class="progress-section">
      <div class="progress-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">

        </svg>
      </div>
      <div class="progress-info">
        <div class="progress-label">Compétence 1 — Conduire</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" role="progressbar" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
      </div>
      <div class="progress-pct" aria-label="38 pourcent">38 %</div>
    </div>
  </div>

  <!-- Titre monde -->
  <div class="world-header">
    <div class="world-badge">Monde 1</div>
    <div class="world-name">Maîtriser la route</div>
  </div>

  <!-- Zone scrollable : fond + route + nodes -->
  <div class="scroll-area">

    <!-- ==========================================
         FOND : CHAMP DE PANNEAUX IMMERSIF
    =========================================== -->

      <!--
        Disposition :
        - Panneaux disposés manuellement sur une grille mentale 390px × 1100px
        - 3 couches : far (petits/flous), mid, near (nets)
        - Rotation légère aléatoire via --rot CSS custom property
        - Jamais centré sous un label (les nodes sont à x≈100 et x≈290, labels ≈ ±80px)
        - Colonnes latérales surtout : 0–60px gauche, 330–390px droite

      <img class="sign sign--far" src="../public/signs/carrefour-giratoire.svg"
           style="--rot:rotate(6deg); left:62px; top:1000px; animation-delay:-7s;">

      <!-- ===== COUCHE MID (46px, blur 1px, 10%) ===== -->

      <img class="sign sign--mid" src="../public/signs/stop.svg"
           style="--rot:rotate(-8deg); left:6px; top:110px; animation-delay:-2s;">
      <img class="sign sign--mid" src="../public/signs/danger-virage-droite.svg"
           style="--rot:rotate(10deg); left:335px; top:150px; animation-delay:-4s;">
      <img class="sign sign--mid" src="../public/signs/sens-unique.svg"
           style="--rot:rotate(-14deg); left:14px; top:250px; animation-delay:-0.5s;">
      <img class="sign sign--mid" src="../public/signs/cedez-le-passage.svg"
           style="--rot:rotate(6deg); left:330px; top:285px; animation-delay:-5.5s;">
      <img class="sign sign--mid" src="../public/signs/circulation-interdite.svg"
           style="--rot:rotate(-5deg); left:8px; top:368px; animation-delay:-3s;">
      <img class="sign sign--mid" src="../public/signs/depassement-interdit.svg"
           style="--rot:rotate(12deg); left:336px; top:405px; animation-delay:-1s;">
      <img class="sign sign--mid" src="../public/signs/interdiction-tourner-gauche.svg"
           style="--rot:rotate(-9deg); left:16px; top:500px; animation-delay:-4.5s;">
      <img class="sign sign--mid" src="../public/signs/fin-toutes-interdictions.svg"
           style="--rot:rotate(7deg); left:328px; top:535px; animation-delay:-2.5s;">
      <img class="sign sign--mid" src="../public/signs/route-prioritaire.svg"
           style="--rot:rotate(-12deg); left:10px; top:615px; animation-delay:-6s;">
      <img class="sign sign--mid" src="../public/signs/priorite-a-droite.svg"
           style="--rot:rotate(9deg); left:332px; top:650px; animation-delay:-1.5s;">

      <img class="sign sign--mid" src="../public/signs/danger-feux-tricolores.svg"
           style="--rot:rotate(11deg); left:330px; top:770px; animation-delay:-7s;">
      <img class="sign sign--mid" src="../public/signs/piste-cyclable-obligatoire.svg"
           style="--rot:rotate(-10deg); left:12px; top:855px; animation-delay:-0.5s;">
      <img class="sign sign--mid" src="../public/signs/danger-passage-pietons.svg"
           style="--rot:rotate(5deg); left:334px; top:890px; animation-delay:-4s;">
      <img class="sign sign--mid" src="../public/signs/fin-route-prioritaire.svg"

      <img class="sign sign--near" src="../public/signs/stop.svg"
           style="--rot:rotate(-7deg); left:-10px; top:180px; animation-delay:-3s;">
      <img class="sign sign--near" src="../public/signs/cedez-le-passage.svg"
           style="--rot:rotate(8deg); left:338px; top:340px; animation-delay:-1s;">
      <img class="sign sign--near" src="../public/signs/sens-interdit.svg"
           style="--rot:rotate(-11deg); left:-8px; top:488px; animation-delay:-4s;">
      <img class="sign sign--near sign--accent" src="../public/signs/route-prioritaire.svg"
           style="--rot:rotate(6deg); left:336px; top:580px; animation-delay:-2.5s;">
      <img class="sign sign--near" src="../public/signs/danger-virage-droite.svg"
           style="--rot:rotate(-9deg); left:-12px; top:710px; animation-delay:-5.5s;">
      <img class="sign sign--near sign--accent" src="../public/signs/piste-cyclable-obligatoire.svg"
           style="--rot:rotate(12deg); left:334px; top:870px; animation-delay:-0.5s;">
      <img class="sign sign--near" src="../public/signs/carrefour-giratoire.svg"

           style="--rot:rotate(10deg); left:332px; top:1060px; animation-delay:-3.5s;">

    </div><!-- /signs-bg -->

    <!-- ==========================================
         ROUTE SVG (tracé zigzag entre les nodes)
         Nodes positions (centre x, top y) :
         N0 : (195, 80)   — départ hors-écran en haut (pas affiché)
         N1 : (110, 130)  done
         N2 : (280, 270)  done
         N3 : (110, 430)  done
         N4 : (280, 580)  ACTIVE (TU ES ICI)
         N5 : (110, 740)  locked
         N6 : (280, 900)  locked
    =========================================== -->

    <svg class="route-svg"
         viewBox="0 0 390 1100"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      <defs>
        <!-- Route principale -->
        <linearGradient id="road-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d1d5db"/>
          <stop offset="100%" stop-color="#e5e7eb"/>
        </linearGradient>

        <!-- Ombre douce sous la route -->
        <filter id="road-shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.12)"/>
        </filter>

        <!-- Glow vert pour le segment validé -->
        <filter id="road-glow" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur"/>
        </filter>
      </defs>

      <!-- Route entière (fond gris) : un chemin large -->
      <path
        d="M 195 40
           C 195 80, 140 90, 110 130
           C 80 170, 80 210, 110 270
           S 320 310, 280 270
           C 240 230, 230 290, 280 270
           C 320 255, 310 360, 280 430
           C 250 500, 110 480, 110 430
           C 110 380, 130 430, 110 430
           C 80 430, 80 510, 110 580
           S 300 600, 280 580
           C 260 560, 260 620, 280 580
           C 300 545, 290 670, 280 740
           C 270 810, 110 790, 110 740
           C 110 690, 130 740, 110 740
           C 80 740, 80 820, 110 900
           S 300 920, 280 900"
        fill="none"
        stroke="#d9dbe6"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#road-shadow)"
      />

      <!-- Ligne centrale pointillée (marquage route) -->
      <path
        d="M 195 40
           C 195 80, 140 90, 110 130
           C 80 170, 80 210, 110 270
           S 280 270, 280 270
           C 280 270, 280 340, 280 430
           S 110 430, 110 430
           C 110 430, 110 510, 110 580
           S 280 580, 280 580
           C 280 580, 280 660, 280 740
           S 110 740, 110 740
           C 110 740, 110 820, 110 900
           S 280 900, 280 900"
        fill="none"
        stroke="#b8bcc8"
        stroke-width="2"
        stroke-dasharray="12 10"
        stroke-linecap="round"
        opacity="0.55"
      />

      <!-- Segment validé (vert) : du début jusqu'au node actif N4 (280, 580) -->
      <path
        d="M 110 130
           C 80 170, 80 210, 110 270
           S 280 270, 280 270
           C 280 340, 280 390, 280 430
           S 110 430, 110 430
           C 110 480, 110 530, 110 580
           S 280 580, 280 580"
        fill="none"
        stroke="#58CC02"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.22"
        filter="url(#road-glow)"
      />

      <!-- Ligne centrale verte sur segment validé -->
      <path
        d="M 110 130
           C 110 200, 180 240, 280 270
           C 280 340, 280 390, 110 430
           C 110 500, 110 540, 280 580"
        fill="none"
        stroke="#58CC02"
        stroke-width="2"
        stroke-dasharray="12 10"
        stroke-linecap="round"
        opacity="0.45"
      />

    </svg>

    <!-- ==========================================
         NODES LAYER
    =========================================== -->
    <div class="nodes-layer" style="height: 1100px; position: relative;">

      <!-- NODE 1 — Validée -->
      <div class="node-wrap" style="left: 110px; top: 95px;">
        <div class="node-tile node-tile--done" role="button" aria-label="Chapitre 1 : Les panneaux, validé">
          <span class="node-letter">P</span>
          <span class="node-dot"></span>
          <!-- Check badge -->
          <div class="node-check" aria-hidden="true">
            <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
              <path d="M1 4L3.5 6.5L9 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="node-label node-label--done">
          <div class="node-label-text">Les panneaux</div>
        </div>
      </div>

      <!-- NODE 2 — Validée -->
      <div class="node-wrap" style="left: 280px; top: 235px;">
        <div class="node-tile node-tile--done" role="button" aria-label="Chapitre 2 : Priorités, validé">
          <span class="node-letter">P</span>
          <span class="node-dot"></span>
          <div class="node-check" aria-hidden="true">
            <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
              <path d="M1 4L3.5 6.5L9 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="node-label node-label--done">
          <div class="node-label-text">Priorités</div>
        </div>
      </div>

      <!-- NODE 3 — Validée -->
      <div class="node-wrap" style="left: 110px; top: 395px;">
        <div class="node-tile node-tile--done" role="button" aria-label="Chapitre 3 : Vitesses, validé">
          <span class="node-letter">P</span>
          <span class="node-dot"></span>
          <div class="node-check" aria-hidden="true">
            <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
              <path d="M1 4L3.5 6.5L9 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="node-label node-label--done">
          <div class="node-label-text">Vitesses</div>
        </div>
      </div>

      <!-- NODE 4 — ACTIVE (TU ES ICI) -->
      <div class="node-wrap" style="left: 280px; top: 545px;">
        <div class="node-tile node-tile--active" role="button" aria-label="Chapitre 4 : Distances, en cours — tu es ici">
          <span class="node-letter">P</span>
          <span class="node-dot"></span>
          <!-- Streak badge -->
          <div class="node-streak" aria-label="7 jours de série">🔥 7</div>
        </div>
        <div class="node-label node-label--active">
          <div class="node-label-text">TU ES ICI</div>
        </div>
        <!-- Sous-label chapitre -->
        <div class="node-label" style="margin-top: 2px; background: rgba(255,255,255,0.85);">
          <div class="node-label-text" style="color: #6b7280; font-size: 10px; font-weight: 500;">Distances de sécurité</div>
        </div>
      </div>

      <!-- NODE 5 — Verrouillée -->
      <div class="node-wrap" style="left: 110px; top: 705px;">
        <div class="node-tile node-tile--locked" role="button" aria-label="Chapitre 5 : Croisements, verrouillé">
          <span class="node-letter" style="font-size: 22px;">🔒</span>
        </div>
        <div class="node-label">
          <div class="node-label-text" style="color: #9ca3af;">Croisements</div>
        </div>
      </div>

      <!-- NODE 6 — Verrouillée -->
      <div class="node-wrap" style="left: 280px; top: 865px;">
        <div class="node-tile node-tile--locked" role="button" aria-label="Chapitre 6 : Autoroute, verrouillé">
          <span class="node-letter" style="font-size: 22px;">🔒</span>
        </div>
        <div class="node-label">
          <div class="node-label-text" style="color: #9ca3af;">Autoroute</div>
        </div>
      </div>

    </div><!-- /nodes-layer -->

  </div><!-- /scroll-area -->

  <!-- Bottom nav -->
  <nav class="bottom-nav" aria-label="Navigation principale">
    <div class="nav-item" role="button" aria-label="Accueil">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 9.5L11 3L19 9.5V19H14V14H8V19H3V9.5Z" stroke="#9ca3af" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">Accueil</span>
    </div>
    <div class="nav-item nav-item--active" role="button" aria-label="Parcours — actif">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M5 17 C5 12 10 12 10 7 C10 2 17 2 17 7 C17 12 12 12 12 17" stroke="#58CC02" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="10" cy="7" r="2" fill="#58CC02"/>
        <circle cx="12" cy="17" r="2" fill="#58CC02"/>
      </svg>
      <span class="nav-label" style="color:#58CC02; font-weight:700;">Parcours</span>
    </div>
    <div class="nav-item" role="button" aria-label="Ligue">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 2L13.6 7.8L20 8.7L15.5 13.1L16.6 19.5L11 16.5L5.4 19.5L6.5 13.1L2 8.7L8.4 7.8L11 2Z" stroke="#9ca3af" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">Ligue</span>
    </div>
    <div class="nav-item" role="button" aria-label="Profil">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="8" r="3.5" stroke="#9ca3af" stroke-width="1.8"/>
        <path d="M4 19C4 15.686 7.134 13 11 13C14.866 13 18 15.686 18 19" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Profil</span>
    </div>
  </nav>

</div><!-- /phone-shell -->

<!--
  NOTE DESIGN — Parti pris artistique :
  Champ de panneaux sur 3 couches (far 6% / mid 10% / near 13%)

</body>
