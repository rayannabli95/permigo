<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0a1a" />
<title>PermiGo — Compétence acquise · Arène 3D / Coffre</title>

<!-- Polices jeu : Fredoka + Baloo 2 (titres) · Nunito (texte) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   PermiGo — « Compétence acquise »
   Direction B : ARÈNE 3D / COFFRE (Supercell / Clash Royale)
   Nuit-violet + or, plastique 3D, max juice premium.
   Mockup statique — aucune dépendance app.
   ============================================================ */

:root{
  /* Scène nuit-violet */
  --night-core:  #2d1b69;     /* centre du dégradé radial */
  --night-mid:   #1a1040;
  --night-edge:  #0d0a1a;     /* bords + fond de page */

  /* Or */
  --gold-1:      #ffe9a8;     /* or clair (highlights) */
  --gold-2:      #ffcf52;     /* or */
  --gold-3:      #f0a818;     /* or profond */
  --gold-deep:   #b9760a;     /* ombre dorée */

  /* Violet verre */
  --glass:       rgba(70, 45, 130, .42);
  --glass-edge:  rgba(255, 207, 82, .42);
  --violet-ink:  #efe7ff;
  --violet-soft: #c9b8ff;
  --violet-mute: #9d8bd6;

  /* Vert GO (uniquement CTA) */
  --go-1:        #6fe016;
  --go-2:        #58cc02;
  --go-shadow:   #46A302;
  --go-edge:     #3d8f02;

  --ease:        cubic-bezier(.22,.61,.36,1);
  --spring:      cubic-bezier(.34,1.56,.64,1);  /* rebond signature */
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }

body{
  font-family:"Nunito", system-ui, sans-serif;
  background:
    radial-gradient(120% 100% at 50% 30%, #1c1330 0%, #120c22 55%, #07050f 100%);
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 18px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ====================== CADRE TÉLÉPHONE ====================== */
.phone{
  position:relative;
  width:390px; max-width:100%;
  height:844px; max-height:calc(100svh - 40px);
  border-radius:44px;
  overflow:hidden;
  background:var(--night-edge);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.04),
    0 40px 90px -28px rgba(0,0,0,.85),
    0 0 70px -10px rgba(108,70,200,.35);
  isolation:isolate;
}

/* ====================== SCÈNE / DÉCOR ====================== */
.scene{
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(120% 90% at 50% 40%,
      var(--night-core) 0%,
      var(--night-mid) 46%,
      var(--night-edge) 100%);
  overflow:hidden;
}

/* Rayons divins dorés rotatifs derrière le focal */
.rays{
  position:absolute;
  left:50%; top:34%;
  width:760px; height:760px;
  transform:translate(-50%,-50%);
  background:repeating-conic-gradient(
    from 0deg at 50% 50%,
    rgba(255,207,82,.20) 0deg 5deg,
    transparent 5deg 13deg);
  -webkit-mask-image:radial-gradient(closest-side, #000 6%, rgba(0,0,0,.55) 40%, transparent 72%);
          mask-image:radial-gradient(closest-side, #000 6%, rgba(0,0,0,.55) 40%, transparent 72%);
  opacity:0;
  animation:raysSpin 26s linear infinite, raysIn 1.1s var(--ease) .15s forwards;
  will-change:transform, opacity;
}
@keyframes raysSpin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
@keyframes raysIn{ to{ opacity:.85; } }

/* Glow doré central, derrière le coffre */
.coreGlow{
  position:absolute;
  left:50%; top:34%;
  width:420px; height:420px;
  transform:translate(-50%,-50%) scale(.6);
  background:radial-gradient(closest-side,
    rgba(255,225,140,.55) 0%,
    rgba(255,190,80,.28) 38%,
    transparent 70%);
  filter:blur(6px);
  opacity:0;
  animation:coreGlowIn 1s var(--ease) .2s forwards, glowBreath 4.2s var(--ease) 1.4s infinite;
}
@keyframes coreGlowIn{ to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
@keyframes glowBreath{
  0%,100%{ opacity:.92; transform:translate(-50%,-50%) scale(1); }
  50%    { opacity:1;   transform:translate(-50%,-50%) scale(1.06); }
}

/* Poussière / étoiles dorées scintillantes */
.dust{ position:absolute; inset:0; pointer-events:none; }
.dust::before, .dust::after{
  content:""; position:absolute; top:0; left:0; width:3px; height:3px; border-radius:50%;
}
.dust::before{
  box-shadow:
    9vw 9vh 0 0 rgba(255,231,168,.9),  21vw 5vh 0 0 rgba(255,207,82,.7),
    33vw 14vh 0 0 rgba(255,255,255,.6), 46vw 7vh 0 0 rgba(255,225,140,.7),
    62vw 12vh 0 0 rgba(255,207,82,.75), 74vw 5vh 0 0 rgba(255,255,255,.55),
    84vw 11vh 0 0 rgba(255,231,168,.7), 91vw 17vh 0 0 rgba(255,207,82,.55),
    16vw 20vh 0 0 rgba(255,255,255,.5), 55vw 19vh 0 0 rgba(255,225,140,.5),
    6vw 33vh 0 0 rgba(255,207,82,.5),   88vw 30vh 0 0 rgba(255,231,168,.55);
  animation:twinkle 4.6s ease-in-out infinite;
}
.dust::after{
  box-shadow:
    12vw 26vh 0 0 rgba(255,231,168,.6), 28vw 31vh 0 0 rgba(255,207,82,.5),
    40vw 4vh 0 0 rgba(255,255,255,.55), 67vw 28vh 0 0 rgba(255,225,140,.45),
    79vw 24vh 0 0 rgba(255,207,82,.5),  95vw 8vh 0 0 rgba(255,231,168,.5),
    50vw 13vh 0 0 rgba(255,255,255,.5), 35vw 38vh 0 0 rgba(255,207,82,.4);
  animation:twinkle 6.2s ease-in-out infinite reverse;
}
@keyframes twinkle{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }

/* Vignette pour focaliser */
.vignette{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 95% at 50% 36%, transparent 42%, rgba(5,4,14,.66) 100%);
}

/* ====================== CONTENU ====================== */
.stage{
  position:relative; z-index:2;
  height:100%;
  display:flex; flex-direction:column;
  align-items:center;
  padding:max(18px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
}

/* Logo discret en haut */
.brandbar{
  width:100%;
  display:flex; justify-content:center;
  padding-top:6px;
  opacity:0;
  animation:fadeDown .7s var(--ease) .1s forwards;
}
.brandbar img{ height:22px; width:auto; filter:drop-shadow(0 3px 10px rgba(120,80,220,.6)); }
.brandbar img.is-broken{ display:none; }
.brandbar .brand-fallback{
  display:none;
  font-family:"Baloo 2", sans-serif; font-weight:800; font-size:18px; letter-spacing:.3px;
  color:#fff; text-shadow:0 3px 10px rgba(120,80,220,.6);
}
.brandbar img.is-broken + .brand-fallback{ display:inline-block; }
@keyframes fadeDown{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:translateY(0); } }

/* Kicker doré « Compétence acquise » + coche */
.kicker{
  margin-top:14px;
  display:inline-flex; align-items:center; gap:9px;
  padding:7px 16px 7px 11px;
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,207,82,.20), rgba(255,207,82,.07));
  border:1px solid rgba(255,207,82,.45);
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 6px 18px -8px rgba(255,180,40,.6);
  opacity:0;
  animation:popIn .6s var(--spring) .25s forwards;
}
.kicker .tick{
  width:22px; height:22px; flex:none;
  border-radius:50%;
  display:grid; place-items:center;
  background:linear-gradient(180deg, var(--go-1), var(--go-2));
  box-shadow:0 2px 0 var(--go-shadow), 0 0 14px -2px rgba(110,224,22,.8);
}
.kicker .tick svg{ width:13px; height:13px; color:#fff; }
.kicker span{
  font-family:"Fredoka", sans-serif; font-weight:600;
  font-size:12.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold-1);
  text-shadow:0 1px 6px rgba(255,180,40,.4);
}
@keyframes popIn{
  0%{ opacity:0; transform:scale(.7); }
  100%{ opacity:1; transform:scale(1); }
}

/* ====================== FOCAL : LE COFFRE ====================== */
.focal{
  position:relative;
  margin-top:8px;
  width:230px; height:200px;
  display:flex; align-items:flex-end; justify-content:center;
}

/* Faisceau de lumière doré qui jaillit du coffre vers le haut */
.beam{
  position:absolute;
  left:50%; bottom:54px;
  width:160px; height:230px;
  transform:translateX(-50%) scaleY(0);
  transform-origin:bottom center;
  background:linear-gradient(180deg,
    rgba(255,236,170,0) 0%,
    rgba(255,221,120,.30) 45%,
    rgba(255,205,82,.55) 100%);
  clip-path:polygon(28% 100%, 72% 100%, 92% 0, 8% 0);
  filter:blur(3px);
  mix-blend-mode:screen;
  opacity:0;
  animation:beamUp .7s var(--spring) .55s forwards, beamFlicker 3.5s ease-in-out 1.3s infinite;
}
@keyframes beamUp{ to{ opacity:.9; transform:translateX(-50%) scaleY(1); } }
@keyframes beamFlicker{ 0%,100%{ opacity:.78; } 50%{ opacity:1; } }

/* Le coffre lui-même */
.chest{
  position:relative;
  width:172px; height:auto;
  transform:scale(.3) translateY(30px);
  opacity:0;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(255,200,90,.55));
  animation:chestPop .85s var(--spring) .4s forwards, chestFloat 4.5s ease-in-out 1.4s infinite;
  will-change:transform;
}
@keyframes chestPop{
  0%{ opacity:0; transform:scale(.3) translateY(30px); }
  60%{ opacity:1; }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes chestFloat{
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-6px); }
}
/* Fallback coffre stylisé CSS si l'image ne charge pas */
.chest.is-broken{ display:none; }
.chest-fallback{
  display:none;
  width:150px; height:110px;
  margin-bottom:6px;
  border-radius:14px 14px 12px 12px;
  background:linear-gradient(180deg, #7a4a1c 0%, #5e3614 60%, #4a2a0f 100%);
  border:3px solid var(--gold-3);
  position:relative;
  box-shadow:0 14px 22px rgba(0,0,0,.5), 0 0 26px rgba(255,200,90,.5);
  filter:none;
  transform:scale(.3) translateY(30px); opacity:0;
  animation:chestPop .85s var(--spring) .4s forwards;
}
.chest.is-broken + .chest-fallback{ display:block; }
.chest-fallback::before{ /* serrure dorée */
  content:""; position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
  width:26px; height:30px; border-radius:6px;
  background:linear-gradient(180deg, var(--gold-1), var(--gold-3));
  box-shadow:0 2px 0 var(--gold-deep);
}
.chest-fallback::after{ /* bande dorée haute */
  content:""; position:absolute; left:-3px; right:-3px; top:30%;
  height:8px; background:linear-gradient(180deg, var(--gold-2), var(--gold-deep));
}

/* Ruban / bannière dorée portant la coche, devant le coffre */
.ribbon{
  position:absolute;
  left:50%; top:-6px;
  transform:translateX(-50%) scale(0) rotate(-8deg);
  width:62px; height:62px;
  border-radius:50%;
  display:grid; place-items:center;
  background:
    radial-gradient(circle at 38% 32%, #fff4d2 0%, var(--gold-1) 22%, var(--gold-2) 55%, var(--gold-3) 100%);
  border:3px solid #fff7df;
  box-shadow:
    0 6px 0 var(--gold-deep),
    0 12px 24px -6px rgba(180,118,10,.7),
    0 0 26px -2px rgba(255,205,82,.85);
  z-index:3;
  animation:medalPop .7s var(--spring) .85s forwards, medalFloat 4.5s ease-in-out 1.7s infinite;
}
.ribbon svg{ width:30px; height:30px; color:#7a4a05; }
@keyframes medalPop{ to{ transform:translateX(-50%) scale(1) rotate(0deg); } }
@keyframes medalFloat{ 0%,100%{ margin-top:0; } 50%{ margin-top:-5px; } }

/* Flash de lumière au moment où le coffre s'ouvre */
.flash{
  position:absolute; left:50%; top:42%;
  width:10px; height:10px; border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,235,170,.6) 40%, transparent 70%);
  z-index:4; pointer-events:none;
  animation:flashBurst .6s var(--ease) .55s forwards;
}
@keyframes flashBurst{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0); }
  35%{ opacity:1; transform:translate(-50%,-50%) scale(34); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(46); }
}

/* Volants qui volent en arc autour du coffre */
.coin{
  position:absolute;
  width:30px; height:30px; z-index:5;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(255,205,82,.6));
  opacity:0;
}
.coin.is-broken{ display:none; }
.coin--1{ left:8%;  top:18%;  animation:coinFly .7s var(--spring) .9s forwards,  coinFloatA 3.6s ease-in-out 1.7s infinite; }
.coin--2{ right:6%; top:12%;  animation:coinFly .7s var(--spring) 1.0s forwards, coinFloatB 4.0s ease-in-out 1.8s infinite; }
.coin--3{ left:16%; top:52%;  animation:coinFly .7s var(--spring) 1.05s forwards, coinFloatB 3.3s ease-in-out 1.9s infinite; }
.coin--4{ right:14%;top:48%;  animation:coinFly .7s var(--spring) 1.12s forwards, coinFloatA 3.9s ease-in-out 2.0s infinite; }
@keyframes coinFly{
  0%{ opacity:0; transform:scale(.2) translateY(20px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes coinFloatA{ 0%,100%{ transform:translateY(0) rotate(-6deg); } 50%{ transform:translateY(-9px) rotate(6deg); } }
@keyframes coinFloatB{ 0%,100%{ transform:translateY(0) rotate(5deg); }  50%{ transform:translateY(-7px) rotate(-7deg); } }

/* ====================== TITRE ====================== */
.titleWrap{ text-align:center; margin-top:10px; }
.title{
  font-family:"Baloo 2", sans-serif; font-weight:800;
  font-size:33px; line-height:1.04; letter-spacing:-.3px;
  color:#fff;
  background:linear-gradient(180deg, #ffffff 0%, #fff4d4 52%, var(--gold-2) 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  /* contour + ombre épaisse façon sticker 3D */
  text-shadow:
    0 2px 0 rgba(90,50,10,.5),
    0 4px 0 rgba(60,30,5,.45),
    0 8px 18px rgba(0,0,0,.55);
  -webkit-text-stroke:0 transparent;
  filter:drop-shadow(0 0 1px rgba(120,70,10,.6));
  transform:scale(.6);
  opacity:0;
  animation:titleSlam .7s var(--spring) .75s forwards;
}
@keyframes titleSlam{
  0%{ opacity:0; transform:scale(.6); }
  60%{ opacity:1; transform:scale(1.08); }
  100%{ opacity:1; transform:scale(1); }
}
.subtitle{
  margin-top:8px;
  font-family:"Fredoka", sans-serif; font-weight:500; font-size:15px;
  color:var(--violet-soft);
  letter-spacing:.02em;
  opacity:0;
  animation:fadeUp .6s var(--ease) .95s forwards;
}
.subtitle b{ color:var(--gold-1); font-weight:600; }

/* ====================== STATS (pilules plastique 3D) ====================== */
.stats{
  display:flex; gap:13px;
  margin-top:18px;
  width:100%; max-width:320px;
}
.stat{
  flex:1;
  padding:13px 10px 12px;
  border-radius:18px;
  text-align:center;
  background:linear-gradient(180deg, rgba(120,85,200,.34), rgba(50,30,100,.40));
  border:1.5px solid rgba(255,207,82,.40);
  box-shadow:
    0 1px 0 rgba(255,255,255,.22) inset,
    0 -10px 18px -12px rgba(0,0,0,.5) inset,
    0 10px 22px -10px rgba(0,0,0,.6);
  opacity:0;
  transform:translateY(14px);
}
.stat--1{ animation:statUp .55s var(--spring) 1.05s forwards; }
.stat--2{ animation:statUp .55s var(--spring) 1.18s forwards; }
@keyframes statUp{ to{ opacity:1; transform:translateY(0); } }
.stat__val{
  font-family:"Baloo 2", sans-serif; font-weight:800; font-size:27px; line-height:1;
  color:var(--gold-1);
  text-shadow:0 2px 0 rgba(90,50,10,.4), 0 5px 10px rgba(0,0,0,.4);
  font-variant-numeric:tabular-nums;
}
.stat__lab{
  margin-top:5px;
  font-family:"Nunito", sans-serif; font-weight:700; font-size:11.5px;
  letter-spacing:.06em; text-transform:uppercase;
  color:var(--violet-soft);
}

/* ====================== BARRE « PERMIS VIRTUEL » ====================== */
.permis{
  width:100%; max-width:320px;
  margin-top:16px;
  opacity:0; transform:translateY(12px);
  animation:statUp .55s var(--spring) 1.3s forwards;
}
.permis__top{
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:8px;
}
.permis__lab{
  font-family:"Fredoka", sans-serif; font-weight:600; font-size:13.5px;
  color:var(--violet-ink); letter-spacing:.01em;
  display:inline-flex; align-items:center; gap:7px;
}
.permis__lab svg{ width:16px; height:16px; color:var(--gold-2); }
.permis__pct{
  font-family:"Baloo 2", sans-serif; font-weight:800; font-size:16px;
  color:var(--gold-1); font-variant-numeric:tabular-nums;
  text-shadow:0 2px 6px rgba(0,0,0,.4);
}
.permis__track{
  position:relative;
  height:16px; border-radius:999px;
  background:linear-gradient(180deg, #1a1136, #2a1c52);
  border:1px solid rgba(255,207,82,.22);
  box-shadow:0 2px 6px rgba(0,0,0,.5) inset;
  overflow:hidden;
}
.permis__fill{
  position:absolute; left:0; top:0; bottom:0;
  width:0;
  border-radius:999px;
  background:linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 48%, var(--gold-3) 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.5) inset,
    0 0 16px -1px rgba(255,200,70,.9);
  transition:width 1.1s var(--ease);
}
/* reflet qui balaye le fill */
.permis__fill::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  transform:translateX(-100%);
  animation:shine 2.4s var(--ease) 1.9s infinite;
}
@keyframes shine{ 0%{ transform:translateX(-100%); } 60%,100%{ transform:translateX(220%); } }

/* ====================== RÉCOMPENSE +25 VOLANTS ====================== */
.reward{
  margin-top:16px;
  display:inline-flex; align-items:center; gap:10px;
  padding:9px 18px 9px 12px;
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,207,82,.22), rgba(255,180,40,.10));
  border:1.5px solid rgba(255,207,82,.5);
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 8px 20px -8px rgba(255,170,30,.6);
  opacity:0; transform:scale(.7);
  animation:popIn .6s var(--spring) 1.45s forwards, rewardPulse 2.6s var(--ease) 2.1s infinite;
}
@keyframes rewardPulse{ 0%,100%{ box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 8px 20px -8px rgba(255,170,30,.6); } 50%{ box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 10px 28px -6px rgba(255,180,40,.9); } }
.reward img{
  width:28px; height:28px;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
}
.reward img.is-broken{ display:none; }
.reward .coin-fallback{
  display:none; width:28px; height:28px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #fff4d2, var(--gold-2) 55%, var(--gold-3));
  border:2px solid #fff7df; box-shadow:0 2px 0 var(--gold-deep);
}
.reward img.is-broken + .coin-fallback{ display:inline-block; }
.reward__num{
  font-family:"Baloo 2", sans-serif; font-weight:800; font-size:20px;
  color:#fff;
  text-shadow:0 2px 0 rgba(90,50,10,.45), 0 4px 8px rgba(0,0,0,.4);
  font-variant-numeric:tabular-nums;
}
.reward__lab{
  font-family:"Nunito", sans-serif; font-weight:800; font-size:13px;
  color:var(--gold-1); letter-spacing:.02em;
}

/* ====================== CTA « CONTINUER » (bouton plastique 3D vert) ====================== */
.ctaWrap{
  margin-top:auto;
  padding-top:18px;
  width:100%; max-width:320px;
}
.cta{
  position:relative;
  width:100%; min-height:60px;
  border:0; border-radius:20px;
  cursor:pointer;
  font-family:"Baloo 2", sans-serif; font-weight:800; font-size:19px; letter-spacing:.3px;
  color:#fff;
  text-shadow:0 2px 0 rgba(40,90,5,.55);
  background:linear-gradient(180deg, var(--go-1) 0%, var(--go-2) 100%);
  /* ombre du bas SOLIDE = bouton physique pressable */
  box-shadow:
    0 1.5px 0 rgba(255,255,255,.5) inset,
    0 6px 0 var(--go-shadow),
    0 10px 22px -6px rgba(70,163,2,.7);
  transform:translateY(0);
  opacity:0;
  animation:ctaIn .55s var(--spring) 1.6s forwards, ctaBreath 2.8s var(--ease) 2.4s infinite;
  transition:transform .08s var(--ease), box-shadow .08s var(--ease), filter .15s var(--ease);
  -webkit-user-select:none; user-select:none;
}
.cta:hover{ filter:brightness(1.05); }
.cta:active{
  transform:translateY(4px);
  box-shadow:
    0 1.5px 0 rgba(255,255,255,.5) inset,
    0 2px 0 var(--go-shadow),
    0 5px 12px -6px rgba(70,163,2,.6);
  animation-play-state:paused;
}
.cta:focus-visible{ outline:3px solid rgba(255,255,255,.6); outline-offset:3px; }
.cta svg{ width:20px; height:20px; vertical-align:-4px; margin-left:8px; }
@keyframes ctaIn{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }
@keyframes ctaBreath{
  0%,100%{ transform:translateY(0) scale(1); }
  50%    { transform:translateY(0) scale(1.018); }
}

/* ====================== MASCOTTE ====================== */
.mascot{
  position:absolute;
  left:14px; bottom:84px;
  width:86px; height:auto;
  z-index:6;
  transform:translateY(30px); opacity:0;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));
  animation:mascotIn .6s var(--spring) 1.5s forwards, mascotBounce 1.6s var(--ease) 2.2s infinite;
  pointer-events:none;
}
.mascot.is-broken{ display:none; }
@keyframes mascotIn{ to{ transform:translateY(0); opacity:1; } }
@keyframes mascotBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-12px); } }

/* ====================== CONFETTIS ====================== */
.confetti{ position:absolute; inset:0; z-index:7; pointer-events:none; overflow:hidden; }
.confetti i{
  position:absolute; top:30%; left:50%;
  width:9px; height:13px; border-radius:2px;
  opacity:0;
  will-change:transform, opacity;
}

/* ====================== REDUCED MOTION ====================== */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation:none !important;
    transition:none !important;
  }
  .rays{ opacity:.7; }
  .coreGlow, .chest, .ribbon, .coin, .title, .subtitle, .kicker,
  .stat, .permis, .reward, .cta, .mascot, .brandbar, .beam{
    opacity:1 !important; transform:none !important;
  }
  .permis__fill{ width:58% !important; }
  .flash, .confetti{ display:none !important; }
}

/* Petits écrans : on resserre */
@media (max-height:760px){
  .focal{ height:172px; margin-top:2px; }
  .chest{ width:148px; }
  .title{ font-size:29px; }
  .mascot{ width:74px; bottom:78px; }
}
</style>
</head>
<body>

<div class="phone">
  <!-- DÉCOR -->
  <div class="scene" aria-hidden="true">
    <div class="rays"></div>
    <div class="coreGlow"></div>
    <div class="dust"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- CONFETTIS (injectés en JS) -->
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <!-- CONTENU -->
  <main class="stage" role="dialog" aria-label="Compétence acquise">

    <div class="brandbar">
      <img src="../public/permigo-logo.png" alt="PermiGo"
           onerror="this.classList.add('is-broken')" />
      <span class="brand-fallback" aria-hidden="true">PermiGo</span>
    </div>

    <!-- Kicker -->
    <div class="kicker">
      <span class="tick" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <span>Compétence acquise</span>
    </div>

    <!-- FOCAL : coffre + faisceau + médaille + volants -->
    <div class="focal" aria-hidden="true">
      <div class="beam"></div>
      <div class="flash"></div>

      <img class="chest" src="../public/skins/chest-open.png" alt=""
           onerror="this.classList.add('is-broken')" />
      <div class="chest-fallback"></div>

      <!-- Médaille dorée qui « sort » du coffre -->
      <div class="ribbon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>

      <!-- Volants en arc -->
      <img class="coin coin--1" src="../public/skins/volant-coin.webp" alt="" onerror="this.classList.add('is-broken')" />
      <img class="coin coin--2" src="../public/skins/volant-coin.webp" alt="" onerror="this.classList.add('is-broken')" />
      <img class="coin coin--3" src="../public/skins/volant-coin.webp" alt="" onerror="this.classList.add('is-broken')" />
      <img class="coin coin--4" src="../public/skins/volant-coin.webp" alt="" onerror="this.classList.add('is-broken')" />
    </div>

    <!-- TITRE -->
    <div class="titleWrap">
      <h1 class="title">S'insérer sur<br>l'autoroute</h1>
      <p class="subtitle"><b>C3</b> · Montagne</p>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat stat--1">
        <div class="stat__val"><span id="scoreVal">0</span>%</div>
        <div class="stat__lab">Score</div>
      </div>
      <div class="stat stat--2">
        <div class="stat__val"><span id="acqVal">0</span> / 31</div>
        <div class="stat__lab">Acquises</div>
      </div>
    </div>

    <!-- BARRE PERMIS VIRTUEL -->
    <div class="permis">
      <div class="permis__top">
        <span class="permis__lab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="3"/><circle cx="8" cy="12" r="2.4"/>
            <path d="M13 10h6M13 14h4"/>
          </svg>
          Permis virtuel
        </span>
        <span class="permis__pct"><span id="permisVal">0</span>%</span>
      </div>
      <div class="permis__track">
        <div class="permis__fill" id="permisFill"></div>
      </div>
    </div>

    <!-- RÉCOMPENSE -->
    <div class="reward">
      <img src="../public/skins/volant-coin.webp" alt="" onerror="this.classList.add('is-broken')" />
      <span class="coin-fallback" aria-hidden="true"></span>
      <span class="reward__num">+<span id="volantVal">0</span></span>
      <span class="reward__lab">volants</span>
    </div>

    <!-- CTA -->
    <div class="ctaWrap">
      <button type="button" class="cta" id="cta">
        Continuer
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>
  </main>

  <!-- MASCOTTE -->
  <img class="mascot" src="../public/skins/mascot-celebrate.png" alt=""
       onerror="this.classList.add('is-broken')" aria-hidden="true" />
</div>

<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // --- Vibration best-effort au moment du « slam » du titre ---
  if(!reduce){
    setTimeout(function(){
      try{ navigator.vibrate && navigator.vibrate([0, 30, 40, 60]); }catch(e){}
    }, 760);
  }

  // --- Compteurs animés ---
  function countTo(el, to, dur, suffix){
    if(!el) return;
    if(reduce){ el.textContent = to; return; }
    const start = performance.now();
    function frame(now){
      const t = Math.min(1, (now - start) / dur);
      // easeOutCubic
      const e = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(to * e);
      if(t < 1) requestAnimationFrame(frame);
      else el.textContent = to;
    }
    requestAnimationFrame(frame);
  }

  // Démarrage des compteurs en cascade (après l'apparition des éléments)
  setTimeout(function(){ countTo(document.getElementById('scoreVal'), 100, 900); }, 1100);
  setTimeout(function(){ countTo(document.getElementById('acqVal'),    18, 900); }, 1200);
  setTimeout(function(){
    countTo(document.getElementById('permisVal'), 58, 1100);
    const fill = document.getElementById('permisFill');
    if(fill) fill.style.width = '58%';
  }, 1300);
  setTimeout(function(){ countTo(document.getElementById('volantVal'), 25, 800); }, 1500);

  // --- Confettis dorés / violets en burst au moment du titre ---
  if(!reduce){
    const wrap = document.getElementById('confetti');
    const colors = ['#ffcf52','#ffe9a8','#8b6cff','#c9b8ff','#f0a818','#ffffff'];
    setTimeout(function(){
      for(let i=0;i<26;i++){
        const c = document.createElement('i');
        const col = colors[i % colors.length];
        const angle = (Math.random() * 2 - 1) * 70;            // -70..70 deg
        const dist  = 120 + Math.random() * 160;               // distance d'éclatement
        const dx = Math.sin(angle * Math.PI/180) * dist;
        const dy = -Math.cos(angle * Math.PI/180) * dist * (0.6 + Math.random()*0.6);
        const rot = (Math.random()*2-1) * 540;
        const delay = Math.random() * 80;
        const dur = 900 + Math.random() * 700;
        c.style.background = col;
        c.style.left = (48 + Math.random()*4) + '%';
        c.style.top  = '34%';
        if(Math.random() > .5) c.style.borderRadius = '50%';
        c.style.width  = (6 + Math.random()*6) + 'px';
        c.style.height = (8 + Math.random()*8) + 'px';
        c.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:'translate('+dx+'px,'+(dy*0.4)+'px) rotate('+(rot*0.4)+'deg)', opacity:1, offset:0.35 },
          { transform:'translate('+(dx*1.3)+'px,'+(dy + 260)+'px) rotate('+rot+'deg)', opacity:0 }
        ], { duration:dur, delay:delay, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' });
        wrap.appendChild(c);
        setTimeout(function(node){ return function(){ node.remove(); }; }(c), dur + delay + 60);
      }
    }, 780);
  }

  // --- CTA : petit feedback + (re)vibration ---
  const cta = document.getElementById('cta');
  if(cta){
    cta.addEventListener('click', function(){
      try{ navigator.vibrate && navigator.vibrate(20); }catch(e){}
    });
  }
})();
</script>
</body>
</html>
