<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a12" />
<title>PermiGo — Compétence acquise (Carte holo)</title>

<!-- Polices : Plus Jakarta Sans (titres/note) + Nunito (texte) + IBM Plex Mono (stats carte) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Nunito:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     PermiGo — « Compétence acquise »
     DIRECTION D : CARTE HOLOGRAPHIQUE À COLLECTIONNER
     La compétence devient une carte premium (FUT / Pokémon holo).
     Foil multi-couches qui balaie au pointeur + tilt 3D + rareté monde.
     ============================================================ */

  :root{
    /* Rareté MONTAGNE = violet */
    --rare:        #8b5cf6;
    --rare-soft:   #a78bfa;
    --rare-deep:   #6d28d9;
    --rare-ink:    #4c1d95;

    /* Or holo (liseré métal + barre) */
    --gold:        #f5d27a;
    --gold-deep:   #c79a3e;
    --gold-soft:   #ffe9b0;

    /* Fond scène sombre premium */
    --bg-top:      #0a0a12;
    --bg-mid:      #100c1c;
    --bg-low:      #14101f;

    /* Texte sur sombre (WCAG AA) */
    --ink:         #f6f4ff;
    --ink-soft:    #c9c4e4;
    --ink-mute:    #968fbf;

    --radius:      16px;
    --card-r:      20px;
    --ease:        cubic-bezier(.22,.61,.36,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    font-family:"Nunito", system-ui, sans-serif;
    color:var(--ink);
    background:#05050a;
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  /* ====================== CADRE TÉLÉPHONE ====================== */
  .phone{
    position:relative;
    width:390px; height:844px;
    max-width:100vw; max-height:100svh;
    border-radius:44px;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 16%, rgba(139,92,246,.20) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-low) 100%);
    box-shadow:0 40px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(167,139,250,.10) inset;
    isolation:isolate;
  }
  @media (max-width:430px){
    .phone{ width:100vw; height:100svh; border-radius:0; }
  }

  /* ====================== DÉCOR DE SCÈNE ====================== */

  /* Halo de rareté qui pulse derrière la carte */
  .halo{
    position:absolute; left:50%; top:46%;
    width:430px; height:430px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,
      rgba(139,92,246,.55) 0%,
      rgba(124,58,237,.30) 38%,
      rgba(76,29,149,.12) 60%,
      transparent 74%);
    filter:blur(10px);
    z-index:1; pointer-events:none;
    animation:haloPulse 4.6s var(--ease) infinite;
    will-change:transform, opacity;
  }
  @keyframes haloPulse{
    0%,100%{ opacity:.78; transform:translate(-50%,-50%) scale(.96); }
    50%    { opacity:1;   transform:translate(-50%,-50%) scale(1.07); }
  }

  /* Couche holographique décorative (asset), discrète, mix screen */
  .holo-bg{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background-size:cover; background-position:center;
    opacity:.10; mix-blend-mode:screen;
    animation:holoBgShift 14s linear infinite;
  }
  @keyframes holoBgShift{ 0%{ filter:hue-rotate(0deg); } 100%{ filter:hue-rotate(360deg); } }

  /* Poussière lumineuse (particules en box-shadow) */
  .dust{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .dust span{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(233,224,255,.9);
    box-shadow:0 0 6px 1px rgba(167,139,250,.8);
    animation:rise linear infinite;
  }
  .dust span:nth-child(1){ left:18%; bottom:-10px; animation-duration:9s;  animation-delay:0s;   }
  .dust span:nth-child(2){ left:34%; bottom:-10px; animation-duration:11s; animation-delay:1.4s; opacity:.7; }
  .dust span:nth-child(3){ left:52%; bottom:-10px; animation-duration:8s;  animation-delay:2.1s; }
  .dust span:nth-child(4){ left:66%; bottom:-10px; animation-duration:12s; animation-delay:.6s;  opacity:.6; }
  .dust span:nth-child(5){ left:78%; bottom:-10px; animation-duration:10s; animation-delay:3s;   }
  .dust span:nth-child(6){ left:26%; bottom:-10px; animation-duration:13s; animation-delay:2.6s; opacity:.5; }
  .dust span:nth-child(7){ left:88%; bottom:-10px; animation-duration:9.5s;animation-delay:1.1s; opacity:.8; }
  .dust span:nth-child(8){ left:44%; bottom:-10px; animation-duration:11.5s;animation-delay:3.8s;opacity:.6; }
  @keyframes rise{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    12%{ opacity:1; }
    85%{ opacity:.9; }
    100%{ transform:translateY(-720px) scale(1.1); opacity:0; }
  }

  /* Vignette pour focaliser sur la carte */
  .vignette{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(120% 80% at 50% 44%, transparent 40%, rgba(3,3,9,.62) 100%);
  }

  /* ====================== CONTENU ====================== */
  .wrap{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center;
    padding:max(20px, env(safe-area-inset-top)) 24px max(26px, env(safe-area-inset-bottom));
  }

  /* Logo discret en haut */
  .top{ width:100%; display:flex; justify-content:center; margin-top:4px; height:22px; }
  .top img{ height:22px; width:auto; opacity:.92; filter:drop-shadow(0 4px 14px rgba(139,92,246,.5)); }
  .top .logo-fallback{
    display:none; font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:18px;
    letter-spacing:-.4px; background:linear-gradient(90deg,#fff,var(--rare-soft));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .top img.is-broken{ display:none; }
  .top img.is-broken + .logo-fallback{ display:inline-block; }

  /* Kicker « Compétence acquise » */
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:26px;
    padding:7px 14px 7px 9px;
    background:rgba(139,92,246,.14);
    border:1px solid rgba(167,139,250,.34);
    border-radius:999px;
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:13px;
    letter-spacing:.3px; color:var(--ink);
    box-shadow:0 0 24px -6px rgba(139,92,246,.6);
    opacity:0; transform:translateY(-8px);
    animation:kickerIn .7s var(--ease) .15s both;
  }
  .kicker .tick{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; flex:none;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold-deep));
    box-shadow:0 0 12px -1px rgba(245,210,122,.85);
  }
  .kicker .tick svg{ width:13px; height:13px; color:#3a2a05; }
  @keyframes kickerIn{ to{ opacity:1; transform:translateY(0); } }

  /* ---------- LA CARTE (focal) ---------- */
  .card-stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    width:100%;
    perspective:1100px;        /* profondeur 3D pour le tilt */
    margin:8px 0 4px;
  }

  /* enveloppe qui porte le tilt + le float + le flip d'entrée */
  .card{
    position:relative;
    width:250px; aspect-ratio:5/7;
    border-radius:var(--card-r);
    transform-style:preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition:transform .14s var(--ease);
    will-change:transform;
    animation:cardFlipIn 1s var(--ease) .25s both, cardFloat 6s ease-in-out 1.4s infinite;
  }
  /* Flip d'entrée : la carte arrive de dos et se retourne face visible */
  @keyframes cardFlipIn{
    0%   { opacity:0; transform:rotateY(-200deg) scale(.82); }
    60%  { opacity:1; }
    100% { opacity:1; transform:rotateY(0deg) scale(1); }
  }
  @keyframes cardFloat{
    0%,100%{ transform:translateY(0)    rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); }
    50%    { transform:translateY(-9px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); }
  }
  /* Quand le pointeur pilote le tilt, on coupe le float pour éviter les conflits */
  .card.is-tilting{ animation:none; transition:transform .08s linear; }

  /* Ombre portée projetée au sol — bouge avec le tilt (var --sx pilotée en JS) */
  .card__shadow{
    position:absolute; left:50%; bottom:-34px;
    width:74%; height:34px;
    transform:translateX(calc(-50% + var(--sx, 0px)));
    background:radial-gradient(closest-side, rgba(2,1,8,.7), transparent 72%);
    filter:blur(9px);
    z-index:-1;
  }

  /* La surface réelle de la carte */
  .card__body{
    position:absolute; inset:0;
    border-radius:var(--card-r);
    overflow:hidden;
    /* bordure métal violet→or en dégradé via padding + fond */
    background:
      linear-gradient(150deg, #1c1430 0%, #241836 46%, #160f26 100%);
    box-shadow:
      0 0 0 2px rgba(0,0,0,.5),
      0 26px 60px -18px rgba(0,0,0,.85),
      0 0 50px -10px rgba(139,92,246,.55);
  }

  /* Cadre métallique (biseau doré/violet) posé par-dessus tout */
  .card__frame{
    position:absolute; inset:0; border-radius:var(--card-r);
    padding:3px; z-index:6; pointer-events:none;
    background:linear-gradient(140deg,
      var(--gold-soft) 0%, var(--gold-deep) 18%,
      var(--rare-soft) 42%, var(--rare-deep) 60%,
      var(--gold) 82%, var(--gold-deep) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    box-shadow:0 0 18px -2px rgba(245,210,122,.5);
  }
  /* liseré lumineux intérieur fin */
  .card__frame::after{
    content:""; position:absolute; inset:3px; border-radius:calc(var(--card-r) - 3px);
    box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;
  }

  /* === Contenu de la carte === */
  .card__art{
    position:absolute; inset:0;
    background:linear-gradient(160deg, #3b2370, #1a1030 70%);
    background-size:cover; background-position:center 30%;
  }
  /* fallback motif si l'image ne charge pas */
  .card__art.is-broken{
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(167,139,250,.5), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
      linear-gradient(160deg, #4b2d8f, #1a1030 75%);
  }
  .card__art.is-broken::after{
    content:"⛰️"; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    font-size:64px; opacity:.5; filter:grayscale(.2) drop-shadow(0 4px 12px rgba(0,0,0,.5));
  }
  /* assombrissement bas pour lisibilité du bandeau */
  .card__scrim{
    position:absolute; inset:0; z-index:2;
    background:linear-gradient(180deg,
      rgba(12,7,28,.32) 0%, transparent 26%,
      transparent 48%, rgba(10,6,24,.82) 86%, rgba(8,4,20,.94) 100%);
  }

  /* Coin haut-gauche : NOTE + catégorie courte (façon carte stat) */
  .card__rating{
    position:absolute; top:14px; left:14px; z-index:4;
    display:flex; flex-direction:column; align-items:center; line-height:1;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
  }
  .card__rating .num{
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:38px;
    color:#fff; letter-spacing:-1px;
    background:linear-gradient(180deg,#fff, var(--gold-soft));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .card__rating .cat{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:13px;
    color:var(--gold-soft); letter-spacing:1px; margin-top:2px;
  }
  .card__rating .divider{
    width:30px; height:2px; margin:4px 0 2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius:2px;
  }

  /* Coin haut-droit : sceau ✓ validé estampillé */
  .card__seal{
    position:absolute; top:12px; right:12px; z-index:4;
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold-deep) 75%);
    box-shadow:0 0 0 2px rgba(255,255,255,.25) inset, 0 4px 14px -2px rgba(0,0,0,.6),
               0 0 16px -2px rgba(245,210,122,.8);
    transform:rotate(-8deg);
    opacity:0; animation:sealStamp .5s var(--ease-spring) 1.05s both;
  }
  @keyframes sealStamp{
    0%{ opacity:0; transform:rotate(-8deg) scale(1.8); }
    100%{ opacity:1; transform:rotate(-8deg) scale(1); }
  }
  .card__seal svg{ width:24px; height:24px; color:#3a2a05; }

  /* n° de collection discret */
  .card__num{
    position:absolute; top:64px; right:14px; z-index:4;
    font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:12px;
    color:rgba(255,255,255,.82); letter-spacing:.5px;
    text-shadow:0 1px 6px rgba(0,0,0,.8);
  }

  /* Bandeau bas : nom de la compétence + ligne monde */
  .card__caption{
    position:absolute; left:0; right:0; bottom:0; z-index:4;
    padding:14px 16px 16px;
    text-align:left;
  }
  .card__name{
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:18.5px;
    line-height:1.12; color:#fff; letter-spacing:-.3px;
    text-shadow:0 2px 12px rgba(0,0,0,.85);
  }
  .card__world{
    margin-top:7px;
    font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:10.5px;
    letter-spacing:1.6px; text-transform:uppercase;
    color:var(--gold-soft);
    text-shadow:0 1px 8px rgba(0,0,0,.8);
  }

  /* === LA COUCHE HOLO (le cœur du wow) === */
  /* Couche 1 : foil conique multi-couleurs en color-dodge, balaie au pointeur */
  .card__foil{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    border-radius:var(--card-r);
    mix-blend-mode:color-dodge;
    opacity:.55;
    background:
      conic-gradient(from var(--foil-a, 120deg) at var(--mx,50%) var(--my,50%),
        #ff2f6e 0deg, #ff9a3c 50deg, #fff45c 100deg, #5cff8f 150deg,
        #46c7ff 210deg, #9b5cff 270deg, #ff5cf0 320deg, #ff2f6e 360deg);
    background-size:200% 200%;
    filter:saturate(1.5) brightness(1.1);
    transition:opacity .2s var(--ease);
  }
  /* Couche 2 : bande de lumière diagonale (glare) en overlay, balaie aussi */
  .card__glare{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    border-radius:var(--card-r);
    mix-blend-mode:overlay;
    background:linear-gradient(105deg,
      transparent 30%,
      rgba(255,255,255,.55) var(--glare, 48%),
      transparent 66%);
    opacity:.7;
  }
  /* Couche 3 : trame holographique fine (sparkle lines) */
  .card__sheen{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    border-radius:var(--card-r);
    mix-blend-mode:color-dodge; opacity:.28;
    background:repeating-linear-gradient(115deg,
      rgba(255,255,255,0) 0 6px,
      rgba(180,120,255,.5) 6px 7px,
      rgba(255,255,255,0) 7px 13px);
    background-size:200% 200%;
  }

  /* Animation auto de balayage (mobile / pas de pointeur) */
  .card.is-auto .card__foil{ animation:foilSweep 5.5s linear infinite; }
  .card.is-auto .card__glare{ animation:glareSweep 5.5s ease-in-out infinite; }
  .card.is-auto .card__sheen{ animation:foilSweep 7s linear infinite reverse; }
  @keyframes foilSweep{
    0%   { background-position:0% 50%; }
    50%  { background-position:100% 50%; }
    100% { background-position:0% 50%; }
  }
  @keyframes glareSweep{
    0%   { --glare:18%; }
    50%  { --glare:80%; }
    100% { --glare:18%; }
  }

  /* ---------- SOUS LA CARTE : Permis virtuel ---------- */
  .progress{
    width:100%; max-width:300px;
    opacity:0; transform:translateY(10px);
    animation:fadeUp .7s var(--ease) 1.25s both;
  }
  .progress__head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:8px;
  }
  .progress__label{
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:700; font-size:13.5px;
    color:var(--ink-soft); letter-spacing:.2px;
  }
  .progress__pct{
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:16px;
    background:linear-gradient(90deg, var(--rare-soft), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .progress__track{
    position:relative; height:12px; border-radius:999px;
    background:rgba(255,255,255,.07);
    box-shadow:0 1px 2px rgba(0,0,0,.5) inset, 0 0 0 1px rgba(167,139,250,.14);
    overflow:hidden;
  }
  .progress__fill{
    position:absolute; inset:0 auto 0 0; width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--rare-deep), var(--rare) 45%, var(--gold) 100%);
    box-shadow:0 0 16px -2px rgba(139,92,246,.9);
    animation:fillGrow 1.3s var(--ease) 1.5s forwards;
  }
  /* reflet qui glisse sur le fill */
  .progress__fill::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    transform:translateX(-100%);
    animation:fillShine 2.4s var(--ease) 2.6s infinite;
  }
  @keyframes fillGrow{ to{ width:58%; } }
  @keyframes fillShine{ 0%{ transform:translateX(-100%);} 60%,100%{ transform:translateX(220%);} }

  /* ---------- CTA + lien ---------- */
  .actions{
    width:100%; max-width:300px; margin-top:20px;
    opacity:0; transform:translateY(12px);
    animation:fadeUp .7s var(--ease) 1.55s both;
  }
  .cta{
    position:relative; width:100%; min-height:56px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:17px;
    color:#fff; letter-spacing:.2px;
    border:0; border-radius:var(--radius); cursor:pointer;
    background:linear-gradient(135deg, var(--rare-soft) 0%, var(--rare) 42%, var(--rare-deep) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.28) inset,
      0 14px 32px -10px rgba(139,92,246,.8),
      0 0 40px -8px rgba(139,92,246,.55);
    overflow:hidden;
    transition:transform .16s var(--ease), box-shadow .25s var(--ease), filter .2s var(--ease);
  }
  .cta::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%);
    transform:translateX(-130%); transition:transform .7s var(--ease);
  }
  .cta:hover{ transform:translateY(-2px); filter:brightness(1.06);
    box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 20px 42px -10px rgba(139,92,246,.95), 0 0 48px -6px rgba(139,92,246,.65); }
  .cta:hover::before{ transform:translateX(130%); }
  .cta:active{ transform:translateY(0) scale(.985); }
  .cta:focus-visible{ outline:3px solid rgba(255,255,255,.6); outline-offset:3px; }
  .cta svg{ vertical-align:-2px; }

  .collection-link{
    display:flex; align-items:center; justify-content:center; gap:7px;
    width:100%; min-height:44px; margin-top:6px;
    font-family:"Nunito",sans-serif; font-weight:700; font-size:14.5px;
    color:var(--ink-soft); text-decoration:none;
    transition:color .2s var(--ease);
  }
  .collection-link svg{ width:16px; height:16px; color:var(--rare-soft); }
  .collection-link:hover{ color:#fff; }
  .collection-link:focus-visible{ outline:2px solid var(--rare-soft); outline-offset:3px; border-radius:8px; }

  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  /* ====================== REDUCED MOTION ====================== */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation:none !important;
      transition-duration:.01ms !important;
    }
    .card{ transform:none; }
    .card__foil{ opacity:.35; background-position:30% 50%; }
    .card__glare{ opacity:.4; }
    .progress__fill{ width:58%; }
    .kicker, .progress, .actions{ opacity:1; transform:none; }
    .card__seal{ opacity:1; transform:rotate(-8deg); }
  }
</style>
</head>
<body>

  <div class="phone">

    <!-- ===== DÉCOR ===== -->
    <div class="holo-bg" id="holoBg" aria-hidden="true"></div>
    <div class="halo" aria-hidden="true"></div>
    <div class="dust" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- ===== CONTENU ===== -->
    <div class="wrap">

      <!-- Logo discret -->
      <div class="top">
        <img src="../public/permigo-logo.png" alt="PermiGo"
             onerror="this.classList.add('is-broken')" />
        <span class="logo-fallback" aria-hidden="true">PermiGo</span>
      </div>

      <!-- Kicker -->
      <div class="kicker">
        <span class="tick" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
               stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        Compétence acquise
      </div>

      <!-- ===== LA CARTE (focal) ===== -->
      <div class="card-stage">
        <div class="card is-auto" id="card">
          <div class="card__shadow" aria-hidden="true"></div>

          <div class="card__body">
            <!-- Illustration du monde Montagne -->
            <div class="card__art" id="cardArt"
                 style="background-image:url('../public/skins/permigo-remc-conditions-difficiles-v1.webp');"></div>
            <div class="card__scrim" aria-hidden="true"></div>

            <!-- Note + catégorie -->
            <div class="card__rating">
              <span class="num">100</span>
              <span class="divider" aria-hidden="true"></span>
              <span class="cat">C3</span>
            </div>

            <!-- Sceau validé -->
            <div class="card__seal" aria-label="Validé">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"
                   stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>

            <!-- n° de collection -->
            <span class="card__num">N°18/31</span>

            <!-- Bandeau bas -->
            <div class="card__caption">
              <div class="card__name">S'insérer sur l'autoroute</div>
              <div class="card__world">Montagne · Conditions difficiles</div>
            </div>

            <!-- Couches holographiques -->
            <div class="card__foil"  aria-hidden="true"></div>
            <div class="card__sheen" aria-hidden="true"></div>
            <div class="card__glare" aria-hidden="true"></div>
          </div>

          <!-- Cadre métallique -->
          <div class="card__frame" aria-hidden="true"></div>
        </div>
      </div>

      <!-- ===== Permis virtuel ===== -->
      <div class="progress">
        <div class="progress__head">
          <span class="progress__label">Permis virtuel</span>
          <span class="progress__pct">58 %</span>
        </div>
        <div class="progress__track">
          <div class="progress__fill"></div>
        </div>
      </div>

      <!-- ===== CTA + lien ===== -->
      <div class="actions">
        <button type="button" class="cta">
          Continuer
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
        <a href="#collection" class="collection-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>
            <rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>
          </svg>
          Voir ma collection
        </a>
      </div>

    </div>
  </div>

  <script>
    (function(){
      const card = document.getElementById('card');
      const art  = document.getElementById('cardArt');
      const holoBg = document.getElementById('holoBg');

      // Asset holo de fond décoratif (si dispo)
      const bgUrl = '../public/skins/permis-bg-holographic.webp';
      const test = new Image();
      test.onload  = () => { holoBg.style.backgroundImage = `url('${bgUrl}')`; };
      test.onerror = () => { holoBg.style.display = 'none'; };
      test.src = bgUrl;

      // Fallback motif si l'illustration de la carte ne charge pas
      const artUrl = '../public/skins/permigo-remc-conditions-difficiles-v1.webp';
      const artTest = new Image();
      artTest.onerror = () => { art.classList.add('is-broken'); art.style.backgroundImage = 'none'; };
      artTest.src = artUrl;

      // Respect du reduced-motion : on laisse la carte figée
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;

      // ===== Tilt 3D + balayage holo qui suivent le pointeur =====
      const MAX = 14; // degrés max de tilt
      let raf = null;

      function onMove(e){
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;   // 0..1
        const py = (e.clientY - r.top)  / r.height;  // 0..1
        const cx = px - .5, cy = py - .5;            // -.5..+.5

        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          card.classList.add('is-tilting');
          card.classList.remove('is-auto');
          // tilt : haut/bas inversé pour un effet « on penche vers le pointeur »
          card.style.setProperty('--ry', (cx *  MAX).toFixed(2) + 'deg');
          card.style.setProperty('--rx', (-cy * MAX).toFixed(2) + 'deg');
          // ombre qui suit l'inclinaison
          card.querySelector('.card__shadow').style.setProperty('--sx', (cx * 26).toFixed(1) + 'px');
          // foil : point focal du conic suit le pointeur + l'angle tourne
          const foil = card.querySelector('.card__foil');
          foil.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
          foil.style.setProperty('--my', (py * 100).toFixed(1) + '%');
          foil.style.setProperty('--foil-a', (120 + cx * 140).toFixed(0) + 'deg');
          foil.style.opacity = .72;
          // glare : la bande lumineuse balaie avec le pointeur
          card.querySelector('.card__glare').style.setProperty('--glare', (20 + px * 60).toFixed(0) + '%');
        });
      }

      function onLeave(){
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        card.querySelector('.card__shadow').style.setProperty('--sx', '0px');
        card.querySelector('.card__foil').style.opacity = '';
        card.classList.remove('is-tilting');
        card.classList.add('is-auto');   // reprend le balayage auto
      }

      // Pointeur fin (souris) → interaction ; tactile → on garde le balayage auto
      const stage = card.closest('.card-stage');
      if (window.matchMedia('(pointer: fine)').matches){
        stage.addEventListener('pointermove', onMove);
        stage.addEventListener('pointerleave', onLeave);
      }

      // Démo : un coup de brillance au clic sur la carte (mobile)
      card.addEventListener('click', () => {
        const foil = card.querySelector('.card__foil');
        foil.style.transition = 'opacity .15s';
        foil.style.opacity = '.9';
        setTimeout(() => { foil.style.opacity = ''; }, 280);
      });
    })();
  </script>
</body>
</html>
