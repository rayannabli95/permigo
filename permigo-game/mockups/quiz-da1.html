<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PermiGo — Quiz · Arène 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-0:#0a0a1f;
    --bg-1:#141135;
    --bg-2:#1d1850;
    --gold:#ffcb3d;
    --gold-2:#ff9b1e;
    --gold-deep:#e07b00;
    --ink:#fef7e6;
    --text:#f4f1ff;
    --text-dim:#b9b2e8;

    /* plastic button palette */
    --btn-top:#3a3470;
    --btn-bot:#231d4f;
    --btn-edge:#15113a;
    --btn-hi:rgba(255,255,255,.28);

    --sel-top:#ffd24a;
    --sel-bot:#ff9c1c;
    --sel-edge:#b85e00;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    font-family:'Fredoka', system-ui, sans-serif;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(120% 90% at 50% -10%, #2a2270 0%, transparent 55%),
      radial-gradient(140% 100% at 50% 120%, #1a0f4d 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    color:var(--text);
    overflow:hidden;
  }

  /* ===== PHONE FRAME ===== */
  .screen{
    position:relative;
    width:390px;
    height:844px;
    max-height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:18px 20px 26px;
    background:
      radial-gradient(150% 70% at 50% -5%, rgba(255,180,60,.10) 0%, transparent 50%),
      radial-gradient(120% 60% at 50% 30%, rgba(110,70,220,.22) 0%, transparent 60%),
      linear-gradient(180deg, #181241 0%, #0c0a26 60%, #08071c 100%);
    isolation:isolate;
  }
  /* vignette */
  .screen::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 140px 30px rgba(2,1,14,.85);
    z-index:6;
  }
  /* faint sparkle dots */
  .screen::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.4px 1.4px at 22% 14%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.2px 1.2px at 78% 9%, rgba(255,210,120,.5), transparent),
      radial-gradient(1.1px 1.1px at 64% 22%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.3px 1.3px at 12% 30%, rgba(180,160,255,.4), transparent),
      radial-gradient(1px 1px at 88% 34%, rgba(255,255,255,.3), transparent);
    pointer-events:none;
    z-index:0;
  }

  /* ===== TOP BAR ===== */
  .topbar{
    position:relative; z-index:7;
    display:flex; align-items:center; gap:12px;
    margin-bottom:6px;
  }
  .top-close{
    width:38px; height:38px; flex:0 0 auto;
    border-radius:12px;
    background:linear-gradient(180deg,#2c2660,#1a1442);
    border:1px solid rgba(255,255,255,.08);
    box-shadow: 0 4px 0 #100c30, inset 0 1px 0 rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:20px; font-weight:700;
  }
  .pips{
    flex:1; display:flex; gap:7px; align-items:center;
  }
  .pip{
    height:11px; border-radius:6px; flex:1;
    background:#251f56;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,255,255,.04);
    position:relative; overflow:hidden;
  }
  .pip.filled{
    background:linear-gradient(180deg, #ffd95e, #f59b16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(255,170,40,.55);
  }
  .pip.active{
    background:linear-gradient(180deg, #ffe588, #ff9d1f);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 16px rgba(255,180,50,.9);
    animation:pipPulse 1.4s ease-in-out infinite;
  }
  .pip.active::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    transform:translateX(-120%);
    animation:pipShine 1.8s ease-in-out infinite;
  }
  @keyframes pipPulse{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.18);} }
  @keyframes pipShine{ 0%{ transform:translateX(-120%);} 60%,100%{ transform:translateX(220%);} }

  .qcount{
    position:relative; z-index:7;
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin-top:10px; margin-bottom:2px;
  }
  .qcount .tag{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:13px;
    letter-spacing:.6px; text-transform:uppercase;
    color:#ffd06a;
    padding:5px 14px;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,190,70,.18), rgba(255,140,30,.08));
    border:1px solid rgba(255,190,70,.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 8px rgba(0,0,0,.3);
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }

  /* ===== HERO / TROPHY SIGN ===== */
  .hero{
    position:relative; z-index:7;
    display:flex; align-items:center; justify-content:center;
    margin:14px 0 6px;
    height:188px;
  }
  /* warm halo behind sign */
  .halo{
    position:absolute; top:50%; left:50%;
    width:280px; height:280px; transform:translate(-50%,-52%);
    background:radial-gradient(circle, rgba(255,170,50,.55) 0%, rgba(255,120,30,.22) 35%, transparent 68%);
    filter:blur(6px);
    z-index:-1;
    animation:haloBreathe 3.6s ease-in-out infinite;
  }
  @keyframes haloBreathe{ 0%,100%{ opacity:.85; transform:translate(-50%,-52%) scale(1);} 50%{ opacity:1; transform:translate(-50%,-52%) scale(1.08);} }

  .sign-wrap{
    position:relative;
    animation:float 4.4s ease-in-out infinite;
    filter:drop-shadow(0 22px 24px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(255,90,60,.35));
  }
  @keyframes float{ 0%,100%{ transform:translateY(0) rotate(-1.2deg);} 50%{ transform:translateY(-12px) rotate(1.2deg);} }

  .sign-svg{ width:172px; height:172px; display:block; }

  /* trophy plinth shimmer ring */
  .ring{
    position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    width:150px; height:34px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,200,80,.45), transparent 70%);
    filter:blur(2px);
    z-index:-1;
  }

  /* ===== MASCOT ===== */
  .mascot{
    position:absolute; right:-6px; top:6px; z-index:8;
    width:96px; height:96px;
    animation:mascotFloat 3.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));
  }
  @keyframes mascotFloat{ 0%,100%{ transform:translateY(0) rotate(3deg);} 50%{ transform:translateY(-9px) rotate(-3deg);} }

  /* ===== QUESTION ===== */
  .question{
    position:relative; z-index:7;
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.28;
    color:#fff;
    padding:8px 8px 0;
    text-shadow:0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(120,90,230,.4);
    margin-top:2px;
  }
  .question .hl{
    position:relative;
    color:#0d0a26;
    padding:1px 8px;
    border-radius:9px;
    background:linear-gradient(180deg,#ffe27a,#ffb02e);
    box-shadow:0 3px 0 var(--gold-deep), inset 0 1px 0 rgba(255,255,255,.6);
    white-space:nowrap;
    text-shadow:none;
    display:inline-block;
    transform:rotate(-1deg);
  }

  /* ===== ANSWERS ===== */
  .answers{
    position:relative; z-index:7;
    margin-top:18px;
    display:flex; flex-direction:column; gap:14px;
    flex:1;
  }

  .ans{
    position:relative;
    display:flex; align-items:center; gap:13px;
    min-height:60px;
    padding:13px 16px;
    border-radius:18px;
    background:linear-gradient(180deg, var(--btn-top) 0%, var(--btn-bot) 100%);
    border:1px solid rgba(255,255,255,.06);
    box-shadow:
      0 7px 0 var(--btn-edge),
      0 12px 16px rgba(0,0,0,.45),
      inset 0 1px 0 var(--btn-hi),
      inset 0 -2px 6px rgba(0,0,0,.4);
    cursor:pointer;
    transform:translateY(0);
    transition:transform .08s ease, box-shadow .08s ease;
    opacity:0;
    animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .ans:nth-child(1){ animation-delay:.10s; }
  .ans:nth-child(2){ animation-delay:.18s; }
  .ans:nth-child(3){ animation-delay:.26s; }
  .ans:nth-child(4){ animation-delay:.34s; }
  @keyframes popIn{
    0%{ opacity:0; transform:translateY(16px) scale(.96);}
    100%{ opacity:1; transform:translateY(0) scale(1);}
  }

  .ans:active{
    transform:translateY(5px);
    box-shadow:
      0 2px 0 var(--btn-edge),
      0 4px 8px rgba(0,0,0,.4),
      inset 0 1px 0 var(--btn-hi),
      inset 0 -2px 6px rgba(0,0,0,.4);
  }

  /* letter chip */
  .ans .chip{
    flex:0 0 auto;
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:18px;
    color:#cfc7ff;
    background:linear-gradient(180deg,#2b2560,#1b1545);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 3px 0 #110d35, inset 0 -2px 4px rgba(0,0,0,.4);
  }
  .ans .label{
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size:15.5px;
    line-height:1.25;
    color:#ece8ff;
    letter-spacing:.1px;
  }

  /* SELECTED (neutral gold press) — option A */
  .ans.selected{
    background:linear-gradient(180deg, var(--sel-top) 0%, var(--sel-bot) 100%);
    border:1px solid rgba(255,255,255,.35);
    transform:translateY(4px);
    box-shadow:
      0 3px 0 var(--sel-edge),
      0 8px 18px rgba(255,140,30,.45),
      0 0 0 3px rgba(255,210,90,.25),
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -2px 6px rgba(180,80,0,.35);
    animation:none; opacity:1;
  }
  .ans.selected .chip{
    color:#fff;
    background:linear-gradient(180deg,#ffffff,#ffe7a8);
    color:#c46a00;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 3px 0 #c46a00;
  }
  .ans.selected .label{
    color:#3a1d00;
    font-weight:600;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .ans.selected::after{
    content:"";
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #ffe9b8);
    box-shadow:0 2px 4px rgba(120,60,0,.4), inset 0 0 0 2px rgba(196,106,0,.25);
  }
  .ans.selected::before{
    content:"";
    position:absolute; right:21px; top:50%;
    width:6px; height:11px; transform:translateY(-62%) rotate(42deg);
    border-right:3px solid #c46a00; border-bottom:3px solid #c46a00;
    border-radius:1px;
    z-index:2;
  }

  /* selected gets a tiny shine sweep */
  .ans.selected .label::before{ content:none; }

  /* hint pulse on selected */
  .glint{
    position:absolute; inset:0; border-radius:18px; overflow:hidden; pointer-events:none;
  }
  .ans.selected .glint::after{
    content:""; position:absolute; top:0; bottom:0; width:40%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    transform:skewX(-18deg) translateX(-220%);
    animation:sweep 2.6s ease-in-out infinite;
  }
  @keyframes sweep{ 0%{ transform:skewX(-18deg) translateX(-220%);} 55%,100%{ transform:skewX(-18deg) translateX(340%);} }

  /* footer hint */
  .footer{
    position:relative; z-index:7;
    text-align:center; margin-top:14px;
    font-size:12.5px; color:var(--text-dim);
    letter-spacing:.3px;
  }
  .footer b{ color:#ffd06a; font-weight:600; }
</style>
</head>
<body>
  <div class="screen">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="top-close">×</div>
      <div class="pips">
        <span class="pip filled"></span>
        <span class="pip active"></span>
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
      </div>
    </div>

    <div class="qcount">
      <span class="tag">Question 2 / 5</span>
    </div>

    <!-- HERO TROPHY SIGN -->
    <div class="hero">
      <div class="halo"></div>

      <!-- Mascot: friendly cartoon driving-school bug-car -->
      <div class="mascot">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7bdcff"/>
              <stop offset="1" stop-color="#2f9adf"/>
            </linearGradient>
            <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#ff9bb0"/>
              <stop offset="1" stop-color="#ff7a96" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- shadow -->
          <ellipse cx="50" cy="90" rx="26" ry="5" fill="rgba(0,0,0,.35)"/>
          <!-- wheels -->
          <circle cx="32" cy="78" r="9" fill="#1b1b2e"/>
          <circle cx="32" cy="78" r="3.6" fill="#cfd6e6"/>
          <circle cx="68" cy="78" r="9" fill="#1b1b2e"/>
          <circle cx="68" cy="78" r="3.6" fill="#cfd6e6"/>
          <!-- body -->
          <path d="M18 70 Q14 46 30 40 L40 36 Q50 26 64 34 L72 42 Q86 48 82 70 Z" fill="url(#carBody)" stroke="#1e6fa8" stroke-width="2.5"/>
          <!-- windshield -->
          <path d="M38 41 Q50 31 62 40 L66 52 L34 52 Z" fill="#dff6ff" stroke="#1e6fa8" stroke-width="2"/>
          <!-- roof beacon (driving school) -->
          <rect x="44" y="22" width="12" height="6" rx="2" fill="#ffd24a" stroke="#b86b00" stroke-width="1.5"/>
          <!-- eyes -->
          <circle cx="42" cy="60" r="6.5" fill="#fff" stroke="#1e6fa8" stroke-width="1.5"/>
          <circle cx="58" cy="60" r="6.5" fill="#fff" stroke="#1e6fa8" stroke-width="1.5"/>
          <circle cx="43.5" cy="61" r="3" fill="#13233a"/>
          <circle cx="59.5" cy="61" r="3" fill="#13233a"/>
          <circle cx="44.6" cy="60" r="1" fill="#fff"/>
          <circle cx="60.6" cy="59" r="1" fill="#fff"/>
          <!-- cheeks -->
          <circle cx="33" cy="66" r="4" fill="url(#cheek)"/>
          <circle cx="67" cy="66" r="4" fill="url(#cheek)"/>
          <!-- smile -->
          <path d="M44 69 Q50 74 56 69" fill="none" stroke="#13233a" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- STOP sign as 3D trophy -->
      <div class="sign-wrap">
        <svg class="sign-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="stopFace" x1="0" y1="0" x2="0.4" y2="1">
              <stop offset="0" stop-color="#ff5a4f"/>
              <stop offset="0.5" stop-color="#e21f1f"/>
              <stop offset="1" stop-color="#a90d12"/>
            </linearGradient>
            <linearGradient id="stopRim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff1c2"/>
              <stop offset="0.5" stop-color="#ffcb3d"/>
              <stop offset="1" stop-color="#c97e00"/>
            </linearGradient>
            <radialGradient id="stopGloss" cx="35%" cy="22%" r="60%">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
              <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- depth / extruded back edge (3D thickness) -->
          <polygon points="30,7 70,7 103,35 103,75 70,103 30,103 7,75 7,35"
                   fill="#6a0008"/>
          <!-- golden bevel rim (trophy frame) -->
          <polygon points="30,2 70,2 98,30 98,70 70,98 30,98 2,70 2,30"
                   fill="url(#stopRim)"/>
          <!-- inner red face -->
          <polygon points="31,7 69,7 93,31 93,69 69,93 31,93 7,69 7,31"
                   fill="url(#stopFace)" stroke="#ffffff" stroke-width="3.4" stroke-opacity="0.9"/>
          <!-- specular gloss -->
          <polygon points="31,7 69,7 93,31 93,69 69,93 31,93 7,69 7,31"
                   fill="url(#stopGloss)"/>
          <!-- STOP text -->
          <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
                font-family="'Baloo 2','Fredoka',sans-serif" font-weight="800"
                font-size="23" letter-spacing="1.2" fill="#ffffff"
                style="paint-order:stroke;" stroke="#8c0a10" stroke-width="1.2">STOP</text>
        </svg>
        <div class="ring"></div>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="question">
      À ce panneau, tu dois&nbsp;<span class="hl">obligatoirement</span>…
    </div>

    <!-- ANSWERS -->
    <div class="answers">
      <div class="ans selected">
        <span class="chip">A</span>
        <span class="label">Marquer un arrêt complet, même si la voie est libre</span>
        <span class="glint"></span>
      </div>
      <div class="ans">
        <span class="chip">B</span>
        <span class="label">Ralentir et passer si c'est dégagé</span>
      </div>
      <div class="ans">
        <span class="chip">C</span>
        <span class="label">Céder le passage puis continuer</span>
      </div>
      <div class="ans">
        <span class="chip">D</span>
        <span class="label">T'arrêter seulement s'il y a du monde</span>
      </div>
    </div>

    <div class="footer">Touche une réponse pour <b>valider</b> ta manche</div>

  </div>
</body>
</html>
