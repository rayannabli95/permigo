<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVANT · le chapitre tel qu'il est aujourd'hui</title>
<style>
@font-face { font-family:'Archivo'; font-style:normal; font-weight:400 900; font-display:block; src:url(archivo.woff2) format('woff2'); }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:'Archivo', system-ui, sans-serif; background:#0b0719; }
.prc-cv{ max-width:480px; margin:0 auto; min-height:100dvh; overflow-x:hidden; color:#fff;
  background:linear-gradient(#120a24 0%, #1a1030 46%, #0b0719 100%); padding-bottom:40px; }
.flag{ margin:0; padding:9px 18px; background:#2a1b52; color:#ffd24a; font:800 11px/1 'Archivo',sans-serif; letter-spacing:.16em; text-transform:uppercase; }
.topbar{ padding:14px 18px 6px; }
.chapnav{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.cn{ min-width:34px; height:34px; padding:0 5px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:11px; font:800 14px/1 'Archivo',sans-serif; color:#cdbff5;
  background:rgba(42,27,82,.6); border:1.5px solid rgba(168,85,247,.28); }
.cn.done{ color:#6ef0a4; border-color:rgba(46,200,110,.45); background:rgba(20,80,46,.4); }
.cn.cur{ color:#3a1c00; background:linear-gradient(160deg,#ffe08a,#ffb33f); border-color:#ffd24a; }
.cn.lock{ color:#8e7fc0; }
.themesw{ display:flex; gap:6px; margin-top:10px; }
.th{ display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:11px; font:700 12px/1 'Archivo',sans-serif;
  color:#cdbff5; background:rgba(42,27,82,.6); border:1.5px solid rgba(168,85,247,.28); }
.hero-wrap{ padding:10px 18px 6px; }
.world-card{ position:relative; border-radius:28px; padding:22px 22px 20px; overflow:hidden;
  background: radial-gradient(380px 200px at 88% -10%, rgba(168,85,247,.55), transparent 60%),
    linear-gradient(150deg, #3a2070 0%, #2a1655 48%, #1d1040 100%);
  border:1px solid rgba(168,85,247,.4);
  box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 -30px 50px -30px rgba(124,77,255,.7) inset,
    0 24px 44px -18px rgba(10,4,26,.9), 0 0 50px -16px rgba(124,77,255,.55); }
.road-deco{ position:absolute; right:-26px; top:-12px; width:170px; height:200px; opacity:.5; z-index:0; }
.meta{ position:relative; z-index:2; }
.chip{ display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:20px;
  background:rgba(18,10,36,.55); border:1px solid rgba(255,210,74,.35);
  font:800 11.5px/1 'Archivo',sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#ffe1a0; }
.chip .dot{ width:7px; height:7px; border-radius:50%; background:linear-gradient(#ffd24a,#ff9c1c); }
.wtitle{ font-weight:800; font-size:27px; line-height:1.02; letter-spacing:-.6px; margin:13px 0 4px; color:#fff; }
.wsub{ font-size:13px; color:#d9cffa; font-weight:500; max-width:235px; line-height:1.35; margin:0; }
.prog{ position:relative; z-index:2; margin-top:18px; }
.pt{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
.pt span{ font-size:12px; color:#b9aee0; font-weight:600; }
.pt b{ font-weight:800; font-size:14px; color:#ffe9a8; }
.bar{ height:13px; border-radius:10px; background:rgba(11,5,24,.7); overflow:hidden; position:relative;
  box-shadow: inset 0 2px 5px rgba(0,0,0,.55); }
.fill{ position:absolute; inset:0; border-radius:10px; background:linear-gradient(90deg,#ffd24a,#ff9c1c 65%,#ff8a0d); }
.route-head{ display:flex; align-items:baseline; justify-content:space-between; padding:22px 22px 0; }
.route-head h2{ margin:0; font-weight:800; font-size:18px; color:#fff; }
.route-head .cnt{ font:700 12px/1 'Archivo',sans-serif; color:#b9aee0; }
.route{ position:relative; height:230px; margin:14px 22px 0; }
.node{ position:absolute; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#2f2159,#221546); border:2px solid rgba(168,85,247,.4); color:#cdbff5; font:800 14px/1 'Archivo',sans-serif; }
.node.done{ background:linear-gradient(180deg,#1f6b3f,#14512d); border-color:rgba(46,200,110,.55); color:#8ff5bb; }
.node.cur{ background:linear-gradient(160deg,#ffe08a,#ffb33f); border-color:#ffd24a; color:#3a1c00; }
</style>
</head>
<body>
<div class="prc-cv">
  <p class="flag">Avant · ce que l'élève voit aujourd'hui</p>
  <div class="topbar">
    <div class="chapnav">
      <span class="cn cur done"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="cn done"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="cn done"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="cn done"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="themesw">
      <span class="th"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Sombre</span>
      <span class="th"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/></svg>Clair</span>
    </div>
  </div>

  <div class="hero-wrap">
    <div class="world-card">
      <svg class="road-deco" viewBox="0 0 170 200" fill="none" aria-hidden="true">
        <path d="M120 -10 C 60 30, 150 70, 80 110 S 30 170, 110 210" stroke="rgba(255,255,255,.18)" stroke-width="26" stroke-linecap="round"/>
        <path d="M120 -10 C 60 30, 150 70, 80 110 S 30 170, 110 210" stroke="rgba(255,210,74,.5)" stroke-width="2.5" stroke-dasharray="9 12" stroke-linecap="round"/>
      </svg>
      <div class="meta">
        <span class="chip"><span class="dot"></span>Chapitre 1 sur 4</span>
        <h1 class="wtitle">Maîtriser le véhicule</h1>
        <p class="wsub">Les bases : démarrer, freiner, diriger.</p>
      </div>
      <div class="prog">
        <div class="pt"><span>Progression du chapitre</span><b>9 / 9</b></div>
        <div class="bar"><div class="fill" style="width:100%"></div></div>
      </div>
    </div>
  </div>

  <div class="route-head"><h2>Ton itinéraire</h2><span class="cnt">9 étapes</span></div>
  <div class="route">
    <span class="node done" style="left:14px; top:6px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="node done" style="right:20px; top:78px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="node cur" style="left:30px; top:150px;">★</span>
  </div>
</div>
</body>
</html>
