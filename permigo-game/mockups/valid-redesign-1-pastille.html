<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Valider · Piste 1 premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--a:#5b53f0;--adk:#3a32c4;--alt:#7d7bff;--acq:#18a558;--acq2:#25c06e;--enc:#2563eb;--enc2:#4b83ff;--rev:#e0850b;--rev2:#f7a733;
--su:#fff;--su2:#f5f6fc;--bg:#eceeff;--ink:#1a1c33;--ink2:#41456a;--mu:#767c9c;--mu2:#9aa0bd;--bo:#e6e8f5;--bo2:#eef0fa;
--disp:'Fredoka',system-ui;--body:'Hanken Grotesk',system-ui;--r:16px}
body{font-family:var(--body);background:radial-gradient(1000px 600px at 50% -8%,#232653,#0c0e18 62%),#0c0e18;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 0 46px;color:#e7e8f4}
.cap{width:392px;max-width:100%;text-align:center;padding:0 18px;margin-bottom:15px}
.cap .k{display:inline-block;font:700 10.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#b9bbe0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:6px 13px;border-radius:999px}
.cap h1{font:600 23px var(--disp);color:#fff;margin:11px 0 4px;letter-spacing:.2px}
.cap p{font:500 12.5px var(--body);color:#9297b8}
.ph{width:392px;max-width:100%;background:var(--bg);min-height:770px;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 44px 100px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.05)}
.ph::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:120px 120px;opacity:.6;pointer-events:none;z-index:5;mix-blend-mode:multiply}
.hd{position:relative;overflow:hidden;background:linear-gradient(150deg,#5b53f0,#7d7bff 60%,#9a6bff);padding:17px 16px 19px;color:#fff}
.hd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 40%);pointer-events:none}
.sign{position:absolute;opacity:.13;pointer-events:none}
.sign.a{width:78px;height:78px;right:-14px;top:-20px;border-radius:50%;border:9px solid #fff}
.sign.b{width:0;height:0;right:60px;bottom:-12px;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:58px solid #fff;transform:rotate(16deg);opacity:.1}
.sign.c{width:52px;height:52px;left:42%;top:-26px;background:#fff;transform:rotate(45deg);opacity:.08;border-radius:8px}
.hd .top{position:relative;z-index:2;display:flex;align-items:center;gap:11px}
.hd .bk{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hd h2{font:600 19px var(--disp);flex:1;letter-spacing:.2px}
/* Médaillon premium 3D (façon medallions.js) */
.med{position:relative;width:47px;height:47px;border-radius:15px;flex:none;display:grid;place-items:center;
background:linear-gradient(158deg,#c6c4ff,#6d6bf5 50%,#4a41d6);
box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 0 26px -2px rgba(176,168,255,.9),0 9px 16px -4px rgba(20,12,80,.6),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -5px 8px rgba(18,10,70,.5)}
.med::after{content:"";position:absolute;inset:3px;border-radius:12px;border:1px solid rgba(255,255,255,.28);pointer-events:none}
.med svg{filter:drop-shadow(0 1.5px 1px rgba(15,8,60,.55))}
.el{position:relative;z-index:6;display:flex;align-items:center;gap:10px;margin:13px 16px 6px;background:var(--su);border:1.5px solid var(--bo);border-radius:15px;padding:10px 13px;box-shadow:0 8px 20px -14px rgba(50,50,110,.5)}
.el .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7d7bff,#5b53f0);color:#fff;display:grid;place-items:center;font:700 13px var(--disp);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px -3px rgba(91,83,240,.6)}
.el .nm{font:800 14px var(--body);color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.el .sub{font:600 11px var(--body);color:var(--mu2);margin-top:2px}
.el .chev{margin-left:auto;color:var(--mu2)}
.body{flex:1;overflow-y:auto;position:relative;z-index:6;padding:10px 16px 12px}
.cat{background:var(--su);border:1.5px solid var(--bo);border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 12px 28px -16px rgba(50,50,110,.45),inset 0 1px 0 rgba(255,255,255,.8)}
.cat-hd{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.cn{width:32px;height:32px;border-radius:10px;background:linear-gradient(160deg,#7d7bff,#5b53f0);color:#fff;display:grid;place-items:center;font:700 13px var(--disp);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px -2px rgba(91,83,240,.5)}
.cat-hd .nm{font:600 15px var(--disp);color:var(--ink);flex:1;letter-spacing:.2px}
.cat-hd .pr{display:flex;align-items:center;gap:8px}
.cat-hd .bar{width:52px;height:7px;border-radius:99px;background:var(--bo2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(40,40,90,.12)}
.cat-hd .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7d7bff,#5b53f0);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.cat-hd .ct{font:700 12px var(--body);color:var(--mu);letter-spacing:.01em}
.cat-hd .chev{color:var(--mu2);transition:transform .2s}
.cat.closed .cat-body{display:none}
.cat.closed .chev{transform:rotate(-90deg)}
.rw{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:13px 13px;border:0;border-top:1px solid var(--bo2);background:transparent;text-align:left;font-family:inherit;cursor:pointer;min-height:58px}
.cat-body .rw:first-child{border-top:1.5px solid var(--bo)}
.rw:active{background:var(--su2)}
.rw .cd{font:800 12px var(--body);color:var(--adk);flex:none;width:32px;letter-spacing:.01em}
.rw .lb{font:600 13.5px/1.25 var(--body);color:var(--ink2);flex:1;min-width:0}
.rw.rw-acquis .lb,.rw.rw-enc .lb,.rw.rw-rev .lb{color:var(--ink);font-weight:700}
.st{display:inline-flex;align-items:center;gap:5px;flex:none;padding:7px 12px;border-radius:999px;font:700 12px var(--disp);white-space:nowrap;letter-spacing:.2px}
.st-non{background:#fff;color:var(--mu);border:1.5px dashed var(--bo);font-family:var(--body);font-weight:700;font-size:11.5px}
.st-acq{color:#fff;background:linear-gradient(180deg,var(--acq2),var(--acq));box-shadow:0 3px 8px -2px rgba(24,165,88,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.st-enc{color:#fff;background:linear-gradient(180deg,var(--enc2),var(--enc));box-shadow:0 3px 8px -2px rgba(37,99,235,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.st-rev{color:#fff;background:linear-gradient(180deg,var(--rev2),var(--rev));box-shadow:0 3px 8px -2px rgba(224,133,11,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.foot{position:relative;z-index:6;padding:11px 16px calc(13px + env(safe-area-inset-bottom));background:rgba(236,238,251,.92);backdrop-filter:blur(10px);border-top:1px solid var(--bo)}
.cta{width:100%;min-height:54px;border:0;border-radius:16px;background:linear-gradient(180deg,#25c06e,#18a558);color:#fff;font:600 16px var(--disp);letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 5px 0 #0f6d38,0 14px 24px -12px rgba(24,165,88,.6),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .1s,box-shadow .1s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #0f6d38,inset 0 1px 0 rgba(255,255,255,.35)}
</style></head><body>
<div class="cap"><span class="k">Piste 1 · premium texturé</span><h1>Tap = ça défile</h1><p>Fredoka + Hanken · grain papier · panneaux · pastilles plastique</p></div>
<div class="ph">
 <div class="hd">
  <span class="sign a"></span><span class="sign b"></span><span class="sign c"></span>
  <div class="top"><span class="bk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 19l-7-7 7-7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><h2>Valider une séance</h2>
   <span class="med"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M16.6 3.4a2.15 2.15 0 0 1 3 3l-1.1 1.1-3-3 1.1-1.1z" fill="#fff"/><path d="M14.9 5.1l3 3L8.2 17.8l-3.9 1.1a.6.6 0 0 1-.74-.74l1.1-3.9L14.9 5.1z" fill="#fff" fill-opacity=".92"/></svg></span></div>
 </div>
 <div class="el"><span class="av">LM</span><span><div class="nm">Léa Mercier</div><div class="sub">14/31 acquises</div></span><span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
 <div class="body">
  <div class="cat">
   <div class="cat-hd"><span class="cn">C1</span><span class="nm">Maîtrise du véhicule</span><span class="pr"><span class="bar"><i style="width:67%"></i></span><span class="ct">6/9</span></span><span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
   <div class="cat-body"><button class="rw rw-acquis"><span class="cd">C1a</span><span class="lb">Organes, commandes, vérifications</span><span class="st st-acq"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Acquis</span></button><button class="rw rw-acquis"><span class="cd">C1b</span><span class="lb">S'installer au poste de conduite</span><span class="st st-acq"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Acquis</span></button><button class="rw rw-acquis"><span class="cd">C1c</span><span class="lb">Tenir le volant, trajectoire</span><span class="st st-acq"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Acquis</span></button><button class="rw rw-acquis"><span class="cd">C1d</span><span class="lb">Démarrer et s'arrêter</span><span class="st st-acq"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Acquis</span></button><button class="rw rw-enc"><span class="cd">C1e</span><span class="lb">Doser accélération et freinage</span><span class="st st-enc"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>En cours</span></button><button class="rw rw-enc"><span class="cd">C1f</span><span class="lb">Utiliser la boîte de vitesses</span><span class="st st-enc"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>En cours</span></button><button class="rw rw-acquis"><span class="cd">C1g</span><span class="lb">Contrôles de sécurité extérieure</span><span class="st st-acq"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Acquis</span></button><button class="rw rw-rev"><span class="cd">C1h</span><span class="lb">Manœuvres : créneau, demi-tour</span><span class="st st-rev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>À revoir</span></button><button class="rw rw-non"><span class="cd">C1i</span><span class="lb">Autonomie sur manœuvres de base</span><span class="st st-non">À évaluer</span></button></div>
  </div>
  <div class="cat closed"><div class="cat-hd"><span class="cn">C2</span><span class="nm">Circulation normale</span><span class="pr"><span class="bar"><i style="width:25%"></i></span><span class="ct">2/8</span></span><span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="cat-body"></div></div>
  <div class="cat closed"><div class="cat-hd"><span class="cn">C3</span><span class="nm">Conditions difficiles</span><span class="pr"><span class="bar"><i style="width:0%"></i></span><span class="ct">0/7</span></span><span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="cat-body"></div></div>
 </div>
 <div class="foot"><button class="cta"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Valider · 6 compétences</button></div>
</div>
<script>
var NEXT={non:'acquis',acquis:'enc',enc:'rev',rev:'non'};
function stateOf(el,p){for(var i=0,a=['acquis','enc','rev'];i<3;i++)if(el.classList.contains(p+a[i]))return a[i];return 'non';}
function setState(el,p,s){el.classList.remove(p+'acquis',p+'enc',p+'rev');if(s!=='non')el.classList.add(p+s);}
var PILL={acquis:'<span class="st st-acq"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Acquis</span>',enc:'<span class="st st-enc"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>En cours</span>',rev:'<span class="st st-rev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>À revoir</span>',non:'<span class="st st-non">À évaluer</span>'};
document.addEventListener('click',function(e){
 var hd=e.target.closest('.cat-hd'); if(hd){hd.parentElement.classList.toggle('closed');return;}
 var rw=e.target.closest('.rw'); if(rw){var n=NEXT[stateOf(rw,'rw-')];setState(rw,'rw-',n);var st=rw.querySelector('.st');if(st)st.outerHTML=PILL[n];}
});
</script>
</body></html>
