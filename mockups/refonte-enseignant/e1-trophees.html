<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette E1 — Trophées enseignant · PermiGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════
   Tokens du projet (copiés de src/styles/base.css :root)
   — vert de marque #58CC02, accent pro = ton encre/sombre
════════════════════════════════════════════════════════════ */
:root{
  --a:#58CC02; --adk:#46A302; --ap:rgba(88,204,2,.09); --ag:rgba(88,204,2,.14);
  --gr:#22c55e; --grk:#16a34a; --grp2:#dcfce7;
  --am:#f59e0b; --amk:#d97706; --amx:#b45309; --aml2:#fbbf24;
  --pu:#8b5cf6; --puk:#7c3aed; --bl:#0ea5e9;
  --bg:#f4f5fb; --bg2:#eceef8; --bg3:#f0f2f8;
  --su:#fff; --su2:#f8f9fd;
  --bo:#e2e6f2; --bo2:#edf0f9; --bo4:#cbd5e1;
  --ink:#0b0d1a; --ink2:#1a1d2e; --ink3:#2d3050; --ink4:#1e293b;
  --mu:#7880a4; --mu2:#94a3b8; --mu3:#64748b; --mu4:#475569; --mu5:#c4ccd8;
  --fd:'Nunito',-apple-system,system-ui,sans-serif;
  --fb:'Nunito',-apple-system,system-ui,sans-serif;
  --fn:'JetBrains Mono','SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:#1a1d2e;font-family:var(--fb);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  padding:24px 12px 64px;min-height:100vh;}

/* Cadre téléphone pour la présentation (hors app) */
.phone{width:100%;max-width:420px;background:var(--bg);border-radius:34px;
  overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative;}
.phone-bar{height:44px;background:var(--ink);display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;color:#fff;font:800 13px/1 var(--fn);}
.phone-bar .dots{display:flex;gap:6px;}
.phone-bar .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);}

/* ════════════════════════════════════════════════════════════
   E1 — Trophées enseignant (moteur visuel des trophées élève tr2-*)
════════════════════════════════════════════════════════════ */
.tr2{background:var(--bg);min-height:600px;padding:0 0 28px;font-family:var(--fb);}

/* Header simple (cohérent avec onglet "Progression") */
.tr2-tabbar{display:flex;gap:4px;padding:12px 14px 0;background:var(--su);}
.tr2-tab{flex:1;text-align:center;padding:9px 4px 12px;font:800 13px/1 var(--fd);
  color:var(--mu2);border-bottom:2.5px solid transparent;cursor:pointer;}
.tr2-tab.on{color:var(--ink);border-bottom-color:var(--a);}

/* Hero — accent PRO = encre/sombre + halo vert de marque (décision figée n°3) */
.tr2-hero{position:relative;overflow:hidden;padding:20px 20px 22px;
  background:linear-gradient(160deg,var(--ink2) 0%,var(--ink3) 60%,var(--ink) 100%);}
.tr2-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 12% 25%,rgba(88,204,2,.30) 0%,transparent 55%),
            radial-gradient(ellipse 55% 60% at 90% 85%,rgba(245,158,11,.16) 0%,transparent 55%);}
.tr2-hero-in{position:relative;z-index:1;}
.tr2-hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.tr2-hero-title{font:900 22px/1.1 var(--fd);color:#fff;letter-spacing:-.03em;}
.tr2-hero-count{font:800 12px/1 var(--fn);color:rgba(255,255,255,.8);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:99px;padding:5px 11px;}
.tr2-prog{display:flex;flex-direction:column;gap:6px;}
.tr2-prog-bar{height:7px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;}
.tr2-prog-fill{height:100%;border-radius:99px;width:42%;
  background:linear-gradient(90deg,var(--a),#9ae831);
  box-shadow:0 0 8px rgba(88,204,2,.6);transition:width 1s cubic-bezier(.2,.7,.3,1);}
.tr2-prog-hint{font:600 11px/1.3 var(--fb);color:rgba(255,255,255,.6);}

/* Bénéfice moniteur (ruban explicatif — présent dans la maquette, pas dans l'app) */
.benef{margin:14px 14px 0;padding:11px 13px;border-radius:13px;
  background:var(--ap);border:1px dashed rgba(88,204,2,.35);
  font:600 11.5px/1.45 var(--fb);color:var(--adk);display:flex;gap:8px;}
.benef b{color:var(--ink);}

/* Section label par tier */
.tr2-group{padding:20px 16px 10px;display:flex;align-items:center;gap:7px;
  font:800 11px/1 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--mu2);}
.tr2-group .gcount{margin-left:auto;font:700 11px/1 var(--fn);color:var(--mu2);text-transform:none;}

/* Grille 3 colonnes */
.tr2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px;}

/* Card trophée */
.tr2-card{position:relative;border-radius:18px;padding:14px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;min-height:118px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden;
  border:0;background:none;width:100%;text-align:center;font-family:inherit;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1);}
.tr2-card:active{transform:scale(.93);}
.tr2-card:focus-visible{outline:3px solid var(--a);outline-offset:3px;}
.tr2-card.locked{background:var(--su);border:1px solid var(--bo);}
.tr2-card.bronze {background:linear-gradient(145deg,#92400e,#d97706);box-shadow:0 4px 16px -4px rgba(205,127,50,.55);}
.tr2-card.argent {background:linear-gradient(145deg,#475569,#cbd5e1);box-shadow:0 4px 16px -4px rgba(148,163,184,.5);}
.tr2-card.or     {background:linear-gradient(145deg,#b45309,#fbbf24);box-shadow:0 4px 16px -4px rgba(245,158,11,.6);}
.tr2-card.platine{background:linear-gradient(145deg,#0369a1,#7dd3fc);box-shadow:0 4px 16px -4px rgba(56,189,248,.55);}
.tr2-card.diamant{background:linear-gradient(145deg,#5b21b6,#c4b5fd);animation:goldGlow 2.6s ease-in-out infinite alternate;}
@keyframes goldGlow{from{box-shadow:0 4px 22px -4px rgba(167,139,250,.6);}
  to{box-shadow:0 4px 32px -2px rgba(196,181,253,.95),0 0 0 1px rgba(196,181,253,.4);}}
.tr2-card-dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;
  background:#fff;box-shadow:0 0 7px rgba(255,255,255,.8);}
.tr2-card-ico{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;transition:transform .2s;}
.tr2-card:not(.locked) .tr2-card-ico{background:rgba(255,255,255,.22);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);}
.tr2-card.locked .tr2-card-ico{background:var(--bg2);color:var(--mu2);border:1px solid var(--bo);}
.tr2-card:not(.locked):active .tr2-card-ico{transform:scale(1.12);}
.tr2-card-name{font:800 10.5px/1.2 var(--fd);letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tr2-card:not(.locked) .tr2-card-name{color:rgba(255,255,255,.96);}
.tr2-card.locked .tr2-card-name{color:var(--mu2);}
.tr2-card-prog{font:700 9.5px/1 var(--fn);color:var(--mu3);
  background:var(--bg2);padding:3px 7px;border-radius:99px;}

/* ── Bottom sheet (détail trophée) ── */
.sheet-bg{position:absolute;inset:0;background:rgba(11,13,26,.62);
  backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s;}
.sheet-bg.open{opacity:1;pointer-events:auto;}
.sheet{width:100%;background:var(--su);border-radius:26px 26px 0 0;overflow:hidden;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.sheet-bg.open .sheet{transform:translateY(0);}
.sheet-glow{height:158px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;position:relative;}
.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.45);border-radius:2px;
  position:absolute;top:12px;left:50%;transform:translateX(-50%);}
.sheet-ico{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.2);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 24px rgba(0,0,0,.25);
  animation:icoIn .5s .08s cubic-bezier(.34,1.56,.64,1) both;}
.sheet-ico svg{width:46px;height:46px;}
@keyframes icoIn{from{transform:scale(.4) rotate(-12deg);opacity:0;}to{transform:none;opacity:1;}}
.sheet-tier{font:800 11px/1 var(--fn);letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.32);
  border-radius:99px;padding:4px 11px;}
.sheet-body{padding:20px 20px 8px;}
.sheet-title{font:900 22px/1.2 var(--fd);color:var(--ink);letter-spacing:-.025em;margin:0 0 8px;}
.sheet-desc{font:600 14px/1.55 var(--fb);color:var(--mu);margin:0 0 16px;}
.sheet-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.sheet-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;
  font:800 12px/1 var(--fn);}
.sheet-chip.val{background:var(--ag);color:var(--adk);}
.sheet-chip.date{background:var(--bg2);color:var(--mu3);}
.sheet-social{font:600 12px/1.45 var(--fb);color:var(--mu2);margin-bottom:18px;}
.sheet-actions{display:flex;gap:8px;padding:0 20px 4px;}
.sheet-share{flex:1;padding:14px;background:var(--a);border:0;border-radius:14px;color:#fff;
  font:800 14px/1 var(--fd);cursor:pointer;min-height:50px;box-shadow:0 4px 0 0 var(--adk);
  display:flex;align-items:center;justify-content:center;gap:8px;}
.sheet-share:active{transform:translateY(3px);box-shadow:0 1px 0 0 var(--adk);}
.sheet-close{padding:14px 20px;background:var(--bg);border:1px solid var(--bo);border-radius:14px;
  color:var(--mu3);font:700 14px/1 var(--fb);cursor:pointer;min-height:50px;}
/* locked variant */
.sheet-glow.locked{background:var(--bg2);border-bottom:1px solid var(--bo);}
.sheet-glow.locked .sheet-ico{background:var(--su);color:var(--mu2);border:1px solid var(--bo);box-shadow:none;}
.sheet-glow.locked .sheet-handle{background:var(--bo4);}
.sheet-glow.locked .sheet-tier{background:var(--su);color:var(--mu3);border-color:var(--bo);}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;}
}
</style>
</head>
<body>
<div class="phone">
  <div class="phone-bar"><span>9:41</span><span class="dots"><i></i><i></i><i></i></span></div>

  <div class="tr2">
    <!-- onglet unique "Progression" : Parcours · Trophées · Ligue (décision figée n°4) -->
    <div class="tr2-tabbar" role="tablist" aria-label="Progression">
      <div class="tr2-tab" role="tab">Parcours</div>
      <div class="tr2-tab on" role="tab" aria-selected="true">Trophées</div>
      <div class="tr2-tab" role="tab">Ligue</div>
    </div>

    <div class="tr2-hero">
      <div class="tr2-hero-in">
        <div class="tr2-hero-top">
          <h1 class="tr2-hero-title">Mes trophées</h1>
          <div class="tr2-hero-count">5 / 12</div>
        </div>
        <div class="tr2-prog">
          <div class="tr2-prog-bar"><div class="tr2-prog-fill" id="fill"></div></div>
          <div class="tr2-prog-hint">42&nbsp;% des jalons atteints — 7 restants à débloquer</div>
        </div>
      </div>
    </div>

    <div class="benef"><span>★</span><div><b>Bénéfice moniteur :</b> chaque trophée est une preuve concrète de son travail — valorisant à débloquer, beau à montrer au patron. Récompense = validations (pas de monnaie virtuelle).</div></div>

    <div id="grid-root"></div>
  </div>

  <!-- bottom sheet -->
  <div class="sheet-bg" id="sheetbg">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détail du trophée"></div>
  </div>
</div>

<script>
// ── Icônes feather (inline) ──────────────────────────────────
const P={
  play:'<polygon points="6 4 20 12 6 20 6 4"/>',
  'check-circle':'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  'user-check':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  'trending-up':'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  award:'<circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>',
  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>'
};
const ic=(n,s=20,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── Tiers (médailles — repris de trophees-moniteur.js) ───────
const TIERS={
  bronze:{label:'Bronze',color:'#cd7f32'},
  argent:{label:'Argent',color:'#94a3b8'},
  or:{label:'Or',color:'#f59e0b'},
  platine:{label:'Platine',color:'#38bdf8'},
  diamant:{label:'Diamant',color:'#a78bfa'},
};

// ── Données simulées : moniteur à 38 validations ─────────────
const D={totalVals:38,streak:9,studentsTotal:6,studentsActive:4};

// ── 12 trophées (contenu repris de trophees-moniteur.js) ─────
const TROPHEES=[
  {tier:'bronze',ico:'play',name:'Premier pas',desc:'Première séance enregistrée dans PermiGo.',goal:'1 séance',v:Math.min(1,D.totalVals),max:1},
  {tier:'bronze',ico:'check-circle',name:'10 validations',desc:'Un début qui compte — 10 acquisitions validées.',goal:'10 validations',v:Math.min(10,D.totalVals),max:10},
  {tier:'bronze',ico:'user-check',name:'Premier élève mobilisé',desc:'Ton premier élève actif dans l’app ces 30 derniers jours.',goal:'1 élève actif',v:Math.min(1,D.studentsActive),max:1},
  {tier:'argent',ico:'flame',name:'Semaine active',desc:'7 jours consécutifs d’activité pédagogique.',goal:'7 jours d’affilée',v:Math.min(7,D.streak),max:7},
  {tier:'argent',ico:'trending-up',name:'50 validations',desc:'La régularité commence à faire une vraie différence.',goal:'50 validations',v:Math.min(50,D.totalVals),max:50},
  {tier:'argent',ico:'users',name:'Classe en formation',desc:'5 élèves suivis simultanément dans PermiGo.',goal:'5 élèves suivis',v:Math.min(5,D.studentsTotal),max:5},
  {tier:'or',ico:'award',name:'100 validations',desc:'Référent pédagogique — 100 acquisitions accompagnées.',goal:'100 validations',v:Math.min(100,D.totalVals),max:100},
  {tier:'or',ico:'zap',name:'Mois sans faille',desc:'30 jours consécutifs actifs sans interruption.',goal:'30 jours d’affilée',v:Math.min(30,D.streak),max:30},
  {tier:'or',ico:'users',name:'Portefeuille solide',desc:'10 élèves accompagnés en parallèle.',goal:'10 élèves suivis',v:Math.min(10,D.studentsTotal),max:10},
  {tier:'platine',ico:'shield',name:'200 validations',desc:'Expertise avérée — tu formes des conducteurs solides.',goal:'200 validations',v:Math.min(200,D.totalVals),max:200},
  {tier:'platine',ico:'check-circle',name:'Classe au complet',desc:'Tous tes élèves actifs sur les 30 derniers jours.',goal:'Toute la classe active',v:D.studentsActive,max:Math.max(3,D.studentsTotal)},
  {tier:'diamant',ico:'star',name:'Expert REMC certifié',desc:'300 validations — le palier ultime. Statut Expert REMC débloqué.',goal:'300 validations',v:Math.min(300,D.totalVals),max:300},
];

// état dérivé
TROPHEES.forEach(t=>{t.unlocked=t.v>=t.max;t.pct=Math.round(t.v/t.max*100);
  t.close=!t.unlocked&&t.pct>=25;t.mystery=!t.unlocked&&!t.close;});

// ── Rendu grille groupée par tier ────────────────────────────
const order=['bronze','argent','or','platine','diamant'];
let html='';
for(const key of order){
  const list=TROPHEES.filter(t=>t.tier===key);
  const done=list.filter(t=>t.unlocked).length;
  const cfg=TIERS[key];
  html+=`<div class="tr2-group" style="color:${cfg.color}">${cfg.label}<span class="gcount">${done}/${list.length}</span></div><div class="tr2-grid">`;
  list.forEach((t)=>{
    const i=TROPHEES.indexOf(t);
    const cls=t.unlocked?t.tier:'locked';
    const icoName=t.mystery?'lock':t.ico;
    const name=t.mystery?'???':esc(t.name);
    const sub=t.unlocked?`<div class="tr2-card-dot"></div>`
      :t.close?`<div class="tr2-card-prog">${t.v}/${t.max}</div>`
      :`<div class="tr2-card-prog">${cfg.label}</div>`;
    html+=`<button class="tr2-card ${cls}" data-i="${i}" aria-label="${name}">
      ${t.unlocked?'<div class="tr2-card-dot"></div>':''}
      <div class="tr2-card-ico">${ic(icoName,t.unlocked?24:20)}</div>
      <div class="tr2-card-name">${name}</div>
      ${t.unlocked?'':sub}
    </button>`;
  });
  html+='</div>';
}
document.getElementById('grid-root').innerHTML=html;
requestAnimationFrame(()=>{document.getElementById('fill').style.width='42%';});

// ── Bottom sheet ─────────────────────────────────────────────
const bg=document.getElementById('sheetbg'),sheet=document.getElementById('sheet');
function gradFor(key){return getComputedStyle(document.querySelector('.tr2-card.'+key)||document.body).background;}
const GRAD={bronze:'linear-gradient(145deg,#92400e,#d97706)',argent:'linear-gradient(145deg,#475569,#cbd5e1)',
  or:'linear-gradient(145deg,#b45309,#fbbf24)',platine:'linear-gradient(145deg,#0369a1,#7dd3fc)',
  diamant:'linear-gradient(145deg,#5b21b6,#c4b5fd)'};
function open(i){
  const t=TROPHEES[i],cfg=TIERS[t.tier];
  if(t.unlocked){
    sheet.innerHTML=`
      <div class="sheet-glow" style="background:${GRAD[t.tier]}">
        <div class="sheet-handle"></div>
        <div class="sheet-ico">${ic(t.ico,46)}</div>
        <div class="sheet-tier">${cfg.label}</div>
      </div>
      <div class="sheet-body">
        <h2 class="sheet-title">${esc(t.name)}</h2>
        <p class="sheet-desc">${esc(t.desc)}</p>
        <div class="sheet-meta">
          <div class="sheet-chip val">${ic('check',13,3)} ${esc(t.goal)}</div>
          <div class="sheet-chip date">Débloqué le 2 juin 2026</div>
        </div>
        <div class="sheet-social">Tu fais partie des enseignants les plus actifs de ton école.</div>
      </div>
      <div class="sheet-actions">
        <button class="sheet-share">${ic('share',18)} Partager</button>
        <button class="sheet-close" onclick="closeSheet()">Fermer</button>
      </div>`;
  }else{
    sheet.innerHTML=`
      <div class="sheet-glow locked">
        <div class="sheet-handle"></div>
        <div class="sheet-ico">${ic('lock',40)}</div>
        <div class="sheet-tier">Trophée verrouillé · ${cfg.label}</div>
      </div>
      <div class="sheet-body">
        <h2 class="sheet-title">${t.mystery?'À découvrir':esc(t.name)}</h2>
        <p class="sheet-desc">${t.mystery?'Continue à valider des compétences pour révéler ce trophée.':esc(t.desc)}</p>
        <div class="sheet-meta">
          <div class="sheet-chip val">Objectif : ${esc(t.goal)}</div>
          ${t.close?`<div class="sheet-chip date">${t.v}/${t.max} — ${t.pct}%</div>`:''}
        </div>
        <div class="sheet-social">Chaque validation te rapproche de ce jalon.</div>
      </div>
      <div class="sheet-actions">
        <button class="sheet-share" onclick="closeSheet()">Voir mon parcours →</button>
        <button class="sheet-close" onclick="closeSheet()">Fermer</button>
      </div>`;
  }
  bg.classList.add('open');
}
window.closeSheet=()=>bg.classList.remove('open');
bg.addEventListener('click',e=>{if(e.target===bg)closeSheet();});
document.querySelectorAll('.tr2-card').forEach(el=>el.addEventListener('click',()=>open(+el.dataset.i)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
</script>
</body>
</html>
